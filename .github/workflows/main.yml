name: Re-encode success video for PS4

on:
  workflow_dispatch:
  push:
    paths:
      - 'media/unshackled.mp4'

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Probe source video
        run: |
          echo "--- source file ---"
          ls -la media/unshackled.mp4
          echo "--- source streams ---"
          ffprobe -v error -show_entries \
            stream=index,codec_name,profile,level,width,height,pix_fmt,bit_rate \
            -of default=noprint_wrappers=1 media/unshackled.mp4

      - name: Re-encode to H.264 Constrained Baseline + AAC-LC
        run: |
          ffmpeg -y -i media/unshackled.mp4 \
            -c:v libx264 \
            -profile:v baseline \
            -level 3.1 \
            -pix_fmt yuv420p \
            -x264-params "cabac=0:bframes=0:8x8dct=0:weightp=0:weightb=0:ref=1:keyint=30:min-keyint=30:scenecut=0" \
            -crf 23 \
            -vf "scale='min(1280,iw)':-2" \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            media/unshackled_ps4.mp4

      - name: Verify output is Baseline and yuv420p
        run: |
          echo "--- output streams ---"
          ffprobe -v error -show_entries \
            stream=codec_name,profile,level,width,height,pix_fmt \
            -of default=noprint_wrappers=1 media/unshackled_ps4.mp4
          python3 - <<'PY'
          import sys
          data = open('media/unshackled_ps4.mp4','rb').read()
          i = data.find(b'avcC')
          if i < 0:
              print("ERROR: no avcC box found"); sys.exit(1)
          profile = data[i+5]
          names = {0x42: "Baseline", 0x4d: "Main", 0x64: "High"}
          print(f"profile_idc = 0x{profile:02x} ({names.get(profile, 'unknown')})")
          if profile != 0x42:
              print("ERROR: not Baseline. PS4 WebKit will show black.")
              sys.exit(1)
          print("OK: Baseline confirmed.")
          PY

      - name: Show before/after sizes (informational only)
        run: |
          IN=$(stat -c%s media/unshackled.mp4)
          OUT=$(stat -c%s media/unshackled_ps4.mp4)
          echo "input  = $IN bytes"
          echo "output = $OUT bytes"
          # No pass/fail here. Baseline re-encodes of already-small sources
          # come out roughly the same size. Baseline correctness was already
          # verified by the avcC check above.

      - name: Replace original with re-encoded version
        run: |
          mv media/unshackled_ps4.mp4 media/unshackled.mp4
          ls -la media/unshackled.mp4

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add media/unshackled.mp4
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: re-encode unshackled.mp4 to H.264 Constrained Baseline for PS4 [skip ci]"
            git push
          fi
