<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Jailbreak</title>
<style>
  *{ box-sizing:border-box; }

  html{ height:100%; background:#08090c; }

  /* full-bleed background photo — always 100% visible */
  html::before{
    content:"";
    position:fixed;
    inset:0;
    background:url("background/bg.png") center / cover no-repeat;
    z-index:-2;
  }
  /* gentle vignette so the glass card reads clearly on any photo */
  html::after{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse at center,
        rgba(0,0,0,.08) 0%,
        rgba(0,0,0,.45) 100%);
    z-index:-1;
    pointer-events:none;
  }

  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
      calc(24px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
    color:#eef2f7;
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition: align-items .35s ease;
  }

  /* ============ THE RECTANGLE ============ */
  #card{
    position:relative;
    width:min(92vw, 440px);
    padding:28px 30px;
    border-radius:20px;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.13);
    -webkit-backdrop-filter:blur(22px) saturate(170%);
            backdrop-filter:blur(22px) saturate(170%);
    box-shadow:
      0 24px 60px rgba(0,0,0,.42),
      0 2px 8px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.20),
      inset 0 -1px 0 rgba(255,255,255,.04);
    animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
    transition: width .35s ease, padding .35s ease;
  }
  /* thin gradient border for a subtle glass "rim" */
  #card::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:inherit;
    padding:1px;
    background:linear-gradient(180deg,
      rgba(255,255,255,.22),
      rgba(255,255,255,.02) 40%,
      rgba(255,255,255,.02) 60%,
      rgba(255,255,255,.10));
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
            mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
    pointer-events:none;
    z-index:2;
  }
  /* top light sheen */
  #card::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(180deg,
      rgba(255,255,255,.08),
      rgba(255,255,255,0) 45%);
    z-index:1;
  }

  /* ============ RUNNING / DONE / FAIL VIEW ============ */
  #running{
    position:relative;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:6px 0 2px;
  }
  .icon-wrap{
    position:relative;
    width:64px;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:8px;
  }
  .spinner{
    width:52px;
    height:52px;
    border:3px solid rgba(255,255,255,.10);
    border-top-color:#7ff0b8;
    border-right-color:rgba(127,240,184,.55);
    border-radius:50%;
    animation: spin .9s linear infinite;
    filter: drop-shadow(0 0 14px rgba(127,240,184,.35));
  }
  .icon-ok, .icon-fail{
    position:absolute;
    inset:0;
    margin:auto;
    width:52px;
    height:52px;
    display:none;
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;
  }
  .icon-ok{
    stroke:#7ff0b8;
    filter: drop-shadow(0 0 14px rgba(127,240,184,.55));
  }
  .icon-fail{
    stroke:#ff9d9d;
    filter: drop-shadow(0 0 14px rgba(255,120,120,.55));
  }

  .msg{
    font-size:17px;
    font-weight:650;
    letter-spacing:.01em;
    text-align:center;
    line-height:1.3;
  }
  .sub{
    font-size:12.5px;
    font-weight:500;
    color:rgba(238,242,247,.55);
    text-align:center;
    letter-spacing:.005em;
  }
  .msg-run{ color:#eef2f7; }
  .msg-done{ color:#7ff0b8; text-shadow:0 0 24px rgba(127,240,184,.45); display:none; }
  .msg-fail{ color:#ff9d9d; text-shadow:0 0 24px rgba(255,120,120,.45); display:none; }
  .sub-done, .sub-fail{ display:none; }

  body.done  .spinner{ display:none; }
  body.done  .icon-ok{ display:block; }
  body.done  .msg-run{ display:none; }
  body.done  .msg-done{ display:block; }
  body.done  .sub-run{ display:none; }
  body.done  .sub-done{ display:block; }

  body.fail  .spinner{ display:none; }
  body.fail  .icon-fail{ display:block; }
  body.fail  .msg-run{ display:none; }
  body.fail  .msg-fail{ display:block; }
  body.fail  .sub-run{ display:none; }
  body.fail  .sub-fail{ display:block; }

  /* ============ LIVE LOG VIEW (body.log) ============ */
  #wrap{ display:none; position:relative; z-index:3; }

  body.log{ align-items:flex-start; }
  body.log #running{ display:none; }
  body.log #card{
    width:min(94vw, 760px);
    padding:20px 22px;
    display:flex;
    flex-direction:column;
    max-height: calc(100dvh - 48px);
    margin:0 auto;
  }
  body.log #wrap{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    gap:12px;
  }

  #state{
    display:none;
    font-size:17px;
    font-weight:650;
    letter-spacing:.01em;
    line-height:1.35;
    color:#eef2f7;
  }
  body.log #state{ display:block; }
  #state.ok{ color:#7ff0b8; }
  #state.warn{ color:#ffd894; }
  #state.bad{ color:#ff9d9d; }
  #state::before{
    content:"";
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:currentColor;
    margin-right:10px;
    vertical-align:middle;
    box-shadow:0 0 12px currentColor;
    animation: pulse 1.6s ease-in-out infinite;
  }

  #out{
    flex:1;
    min-height:0;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font:12px/1.55 ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
    padding:14px 16px;
    border-radius:12px;
    background:rgba(6,8,12,.42);
    border:1px solid rgba(255,255,255,.07);
    color:rgba(238,242,247,.88);
    scrollbar-width:thin;
    scrollbar-color: rgba(255,255,255,.22) transparent;
    overscroll-behavior:contain;
  }
  #out::-webkit-scrollbar{ width:9px; }
  #out::-webkit-scrollbar-track{ background:transparent; }
  #out::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.16);
    border-radius:6px;
    border:2px solid transparent;
    background-clip:content-box;
  }
  #out::-webkit-scrollbar-thumb:hover{
    background:rgba(255,255,255,.28);
    background-clip:content-box;
  }

  #out .ok, #out .safe{ color:#7ff0b8; }
  #out .bad, #out .danger{ color:#ff9d9d; }
  #out .warn{ color:#ffd894; }
  #out code{ color:#a8c4ff; }

  /* ============ KEYFRAMES & FALLBACKS ============ */
  @keyframes spin{ to { transform: rotate(360deg); } }
  @keyframes rise{
    from{ opacity:0; transform:translateY(12px) scale(.98); }
    to  { opacity:1; transform:none; }
  }
  @keyframes pulse{
    0%,100%{ opacity:.55; }
    50%    { opacity:1; }
  }

  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    #card{ background:rgba(14,17,22,.78); }
  }
  @media (prefers-reduced-motion:reduce){
    #card, .spinner, #state::before{ animation:none; }
  }
</style>
</head>
<body>
<main id="card">
  <div id="running">
    <div class="icon-wrap">
      <div class="spinner"></div>
      <svg class="icon-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg>
      <svg class="icon-fail" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
    </div>
    <div class="msg msg-run">Running jailbreak</div>
    <div class="msg msg-done">Jailbreak complete</div>
    <div class="msg msg-fail">Jailbreak failed</div>
    <div class="sub sub-run">Do not close this page</div>
    <div class="sub sub-done">You may now restart your console</div>
    <div class="sub sub-fail">Restart your console and try again</div>
  </div>

  <div id="wrap">
    <div id="state"></div>
    <div id="out"></div>
  </div>
</main>

<script type="module">
  import "./jb.js?v=10";
</script>
</body>
</html>
