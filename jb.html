<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Jailbreak</title>
<style>
  *{ box-sizing:border-box; }

  html{ height:100%; background:#08090c; }

  /* full-bleed background photo, always 100% visible */
  html::before{
    content:"";
    position:fixed;
    inset:0;
    background:url("background/bg.png") center / cover no-repeat;
    z-index:-2;
  }
  html::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,.06) 0%, rgba(0,0,0,.45) 100%);
    z-index:-1;
    pointer-events:none;
  }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
      calc(24px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
    color:#eef2f7;
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition: align-items .35s ease;
  }

  /* ---- glass rectangle ---- */
  #card{
    position:relative;
    width:min(92vw, 440px);
    border-radius:20px;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.13);
    -webkit-backdrop-filter:blur(22px) saturate(170%);
            backdrop-filter:blur(22px) saturate(170%);
    box-shadow:
      0 24px 60px rgba(0,0,0,.42),
      0 2px 8px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.20);
    overflow:hidden;
    animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
    transition: width .35s ease;
  }
  #card::after{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(180deg,
      rgba(255,255,255,.08), rgba(255,255,255,0) 45%);
  }

  /* ---- brand / header ---- */
  #brand{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid rgba(255,255,255,.10);
    background:rgba(0,0,0,.16);
    z-index:1;
  }
  #brand img{
    width:28px; height:28px;
    border-radius:50%;
    flex:0 0 auto;
  }
  #brand b{
    font-size:15px;
    font-weight:700;
    letter-spacing:.10em;
    color:#e6ebf2;
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
    min-width:0;
  }
  #brand .dot{
    width:9px; height:9px;
    border-radius:50%;
    background:#ffd894;
    box-shadow:0 0 12px #ffd894;
    animation: pulse 1.5s ease-in-out infinite;
    flex:0 0 auto;
  }
  .brand-run  { display:inline; }
  .brand-done { display:none;  color:#7ff0b8; }
  .brand-fail { display:none;  color:#ff9d9d; }
  body.done #brand .dot{ background:#7ff0b8; box-shadow:0 0 12px #7ff0b8; animation:none; }
  body.fail #brand .dot{ background:#ff9d9d; box-shadow:0 0 12px #ff9d9d; animation:none; }
  body.done .brand-run  { display:none; }
  body.done .brand-done { display:inline; }
  body.fail .brand-run  { display:none; }
  body.fail .brand-fail { display:inline; }

  /* --------- spinner (running) --------- */
  #spin{
    position:relative;
    width:52px;
    height:52px;
    margin:28px auto 22px;
    border:3px solid rgba(255,255,255,.10);
    border-top-color:#7ff0b8;
    border-right-color:rgba(127,240,184,.55);
    border-radius:50%;
    animation: spin .9s linear infinite;
    filter: drop-shadow(0 0 14px rgba(127,240,184,.35));
  }
  body.done #spin{ display:none; }
  body.fail #spin{ display:none; }

  /* --------- result messages --------- */
  #msg{
    display:none;
    text-align:center;
    padding:0 24px 26px;
    font-size:15px;
    line-height:1.4;
  }
  #msg .msg-run  { display:none;  color:rgba(238,242,247,.70); }
  #msg .msg-done { display:none;  color:#7ff0b8; text-shadow:0 0 24px rgba(127,240,184,.45); }
  #msg .msg-fail { display:none;  color:#ff9d9d; text-shadow:0 0 24px rgba(255,120,120,.45); }

  body.done #msg{ display:block; padding-top:0; }
  body.done #msg .msg-done{ display:block; }
  body.fail #msg{ display:block; padding-top:0; }
  body.fail #msg .msg-fail{ display:block; }

  /* --------- done indicator (green check circle) --------- */
  body.done #card > #spin::after{ display:none; } /* safety */
  #done-badge, #fail-badge{
    display:none;
    width:52px;
    height:52px;
    margin:28px auto 22px;
    border-radius:50%;
    position:relative;
  }
  #done-badge{
    box-shadow: inset 0 0 0 3px #7ff0b8;
    background:radial-gradient(circle,
      rgba(127,240,184,.18) 0%, rgba(127,240,184,0) 65%);
  }
  #done-badge::after{
    content:"";
    position:absolute;
    left:16px; top:14px;
    width:14px; height:24px;
    border:solid #7ff0b8;
    border-width:0 3px 3px 0;
    transform:rotate(45deg);
  }
  #fail-badge{
    box-shadow: inset 0 0 0 3px #ff9d9d;
    background:radial-gradient(circle,
      rgba(255,120,120,.18) 0%, rgba(255,120,120,0) 65%);
  }
  #fail-badge::before,
  #fail-badge::after{
    content:"";
    position:absolute;
    left:12px; top:24px;
    width:28px; height:3px;
    background:#ff9d9d;
    border-radius:2px;
  }
  #fail-badge::before{ transform: rotate(45deg); }
  #fail-badge::after { transform: rotate(-45deg); }

  body.done #done-badge{ display:block; }
  body.fail #fail-badge{ display:block; }

  /* --------- live log view (body.log) --------- */
  #wrap{ display:none; position:relative; z-index:1; }

  body.log{ align-items:flex-start; }
  body.log #spin,
  body.log #msg,
  body.log #done-badge,
  body.log #fail-badge{ display:none; }
  body.log #card{
    width:min(94vw, 760px);
    display:flex;
    flex-direction:column;
    max-height: calc(100vh - 48px);
    margin:0 auto;
  }
  body.log #wrap{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    padding:16px 18px;
    gap:12px;
  }

  #state{
    display:none;
    font-size:17px;
    font-weight:650;
    letter-spacing:.01em;
    line-height:1.35;
    color:#eef2f7;
  }
  body.log #state{ display:block; }
  #state.ok  { color:#7ff0b8; }
  #state.warn{ color:#ffd894; }
  #state.bad { color:#ff9d9d; }
  #state::before{
    content:"";
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background:currentColor;
    margin-right:10px;
    vertical-align:middle;
    box-shadow:0 0 12px currentColor;
    animation: pulse 1.6s ease-in-out infinite;
  }

  #out{
    flex:1;
    min-height:0;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font:12px/1.55 ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
    padding:14px 16px;
    border-radius:12px;
    background:rgba(6,8,12,.42);
    border:1px solid rgba(255,255,255,.07);
    color:rgba(238,242,247,.88);
    scrollbar-width:thin;
    scrollbar-color: rgba(255,255,255,.22) transparent;
    overscroll-behavior:contain;
  }
  #out::-webkit-scrollbar{ width:9px; }
  #out::-webkit-scrollbar-track{ background:transparent; }
  #out::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.16);
    border-radius:6px;
    border:2px solid transparent;
    background-clip:content-box;
  }
  #out::-webkit-scrollbar-thumb:hover{
    background:rgba(255,255,255,.28);
    background-clip:content-box;
  }

  #out .ok,  #out .safe   { color:#7ff0b8; }
  #out .bad, #out .danger { color:#ff9d9d; }
  #out .warn              { color:#ffd894; }
  #out code               { color:#a8c4ff; }

  /* --------- keyframes & fallbacks --------- */
  @keyframes spin{ to { transform: rotate(360deg); } }
  @keyframes rise{
    from{ opacity:0; transform:translateY(12px) scale(.98); }
    to  { opacity:1; transform:none; }
  }
  @keyframes pulse{
    0%,100%{ opacity:.55; }
    50%    { opacity:1; }
  }

  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    #card{ background:rgba(14,17,22,.78); }
  }
  @media (prefers-reduced-motion:reduce){
    #card, #spin, #brand .dot, #state::before{ animation:none; }
  }
</style>
</head>
<body>
  <main id="card">
    <div id="brand">
      <img src="logo_raw.png" alt="" width="28" height="28">
      <b>
        <span class="dot"></span>
        <span class="brand-run">Jailbreaking…</span>
        <span class="brand-done">Jailbreak complete</span>
        <span class="brand-fail">Jailbreak failed</span>
      </b>
    </div>

    <div id="spin"></div>
    <div id="done-badge"></div>
    <div id="fail-badge"></div>

    <div id="msg">
      <div class="msg-run">Do not close this page</div>
      <div class="msg-done">Restart your console (Do Not ReRun!)</div>
      <div class="msg-fail">Restart your console and try again</div>
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
  </main>

  <script>
    /* Pre-module safety net: if the module fails to load -- bad cache entry,
       network down, syntax error -- flip to the fail state instead of
       spinning forever with no signal. */
    window.addEventListener("error", function () {
      try {
        document.body.classList.remove("done");
        document.body.classList.add("fail");
      } catch (e) {}
    });
    window.addEventListener("unhandledrejection", function () {
      try {
        document.body.classList.remove("done");
        document.body.classList.add("fail");
      } catch (e) {}
    });
  </script>
  <script type="module">
    import "./jb.js?v=10";
  </script>
</body>
</html>
