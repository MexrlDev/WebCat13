<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Jailbreak</title>
<script>
  // Must come from index.html. If the token is missing, send them back.
  (function(){
    try {
      if (sessionStorage.getItem("jb-auth") !== "1") {
        location.replace("index.html");
      }
    } catch(e) {
      // sessionStorage unavailable — fail safe by redirecting.
      location.replace("index.html");
    }
  })();
</script>
<style>
  *{ box-sizing:border-box; }
  html{ height:100%; background:#08090c; }
  html::before{
    content:"";
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:url("background/bg.png") center / cover no-repeat;
    z-index:0;
  }
  html::after{
    content:"";
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,.06) 0%, rgba(0,0,0,.45) 100%);
    z-index:1;
    pointer-events:none;
  }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
      calc(24px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
    color:#eef2f7;
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
    z-index:2;
  }
  #card{
    position:relative;
    z-index:10;
    width:min(92vw, 440px);
    border-radius:20px;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.13);
    -webkit-backdrop-filter:blur(22px) saturate(170%);
            backdrop-filter:blur(22px) saturate(170%);
    box-shadow:
      0 24px 60px rgba(0,0,0,.42),
      0 2px 8px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.20);
    overflow:hidden;
    animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
  }
  #card::after{
    content:"";
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(180deg,
      rgba(255,255,255,.08), rgba(255,255,255,0) 45%);
  }
  #brand{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid rgba(255,255,255,.10);
    background:rgba(0,0,0,.16);
    z-index:1;
  }
  #brand img{
    width:28px; height:28px;
    border-radius:50%;
    flex:0 0 auto;
  }
  #brand b{
    font-size:15px;
    font-weight:700;
    letter-spacing:.10em;
    color:#e6ebf2;
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
    min-width:0;
  }
  #brand .dot{
    width:9px; height:9px;
    border-radius:50%;
    background:#ffd894;
    box-shadow:0 0 12px #ffd894;
    animation: pulse 1.5s ease-in-out infinite;
    flex:0 0 auto;
  }
  .brand-run  { display:inline; }
  .brand-done { display:none;  color:#7ff0b8; }
  .brand-fail { display:none;  color:#ff9d9d; }
  body.done #brand .dot{ background:#7ff0b8; box-shadow:0 0 12px #7ff0b8; animation:none; }
  body.fail #brand .dot{ background:#ff9d9d; box-shadow:0 0 12px #ff9d9d; animation:none; }
  body.done .brand-run  { display:none; }
  body.done .brand-done { display:inline; }
  body.fail .brand-run  { display:none; }
  body.fail .brand-fail { display:inline; }
  #status{
    position:relative;
    width:64px;
    height:64px;
    margin:30px auto 22px;
  }
  #spinner{
    position:absolute;
    top:0; left:0;
    width:64px; height:64px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.10);
    border-top-color:#7ff0b8;
    border-right-color:rgba(127,240,184,.55);
    animation: spin .9s linear infinite;
    filter: drop-shadow(0 0 14px rgba(127,240,184,.35));
  }
  .status-svg{
    display:none;
    position:absolute;
    top:0; left:0;
    width:64px; height:64px;
  }
  .status-check{ color:#7ff0b8; filter: drop-shadow(0 0 14px rgba(127,240,184,.55)); }
  .status-fail { color:#ff9d9d; filter: drop-shadow(0 0 14px rgba(255,120,120,.55)); }
  body.done #spinner{ display:none; }
  body.done .status-check{ display:block; }
  body.fail #spinner{ display:none; }
  body.fail .status-fail{ display:block; }
  #msg{
    display:block;
    text-align:center;
    padding:0 24px 26px;
    font-size:15px;
    line-height:1.4;
  }
  #msg .msg-run  { display:block; color:rgba(238,242,247,.70); }
  #msg .msg-done { display:none;  color:#7ff0b8; text-shadow:0 0 24px rgba(127,240,184,.45); }
  #msg .msg-fail { display:none;  color:#ff9d9d; text-shadow:0 0 24px rgba(255,120,120,.45); }
  body.done #msg .msg-run { display:none; }
  body.done #msg .msg-done{ display:block; }
  body.fail #msg .msg-run { display:none; }
  body.fail #msg .msg-fail{ display:block; }
  #wrap{ display:none; position:relative; z-index:1; }
  body.log{ align-items:flex-start; }
  body.log #status,
  body.log #msg{ display:none !important; }
  body.log #card{
    width:min(94vw, 760px);
    display:flex;
    flex-direction:column;
    max-height: calc(100vh - 48px);
    margin:0 auto;
  }
  body.log #wrap{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    padding:16px 18px;
    gap:12px;
  }
  #state{
    display:none;
    font-size:17px;
    font-weight:650;
    letter-spacing:.01em;
    line-height:1.35;
    color:#eef2f7;
  }
  body.log #state{ display:block; }
  #state.ok  { color:#7ff0b8; }
  #state.warn{ color:#ffd894; }
  #state.bad { color:#ff9d9d; }
  #state::before{
    content:"";
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background:currentColor;
    margin-right:10px;
    vertical-align:middle;
    box-shadow:0 0 12px currentColor;
    animation: pulse 1.6s ease-in-out infinite;
  }
  #out{
    flex:1;
    min-height:0;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font:12px/1.55 ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
    padding:14px 16px;
    border-radius:12px;
    background:rgba(6,8,12,.42);
    border:1px solid rgba(255,255,255,.07);
    color:rgba(238,242,247,.88);
    scrollbar-width:thin;
    scrollbar-color: rgba(255,255,255,.22) transparent;
    overscroll-behavior:contain;
  }

  /* ============================================================
     VIDEO STAGE — replicates Test G exactly:
       - display:none by default, set to display:block by JS only
       - #card is removeChild'd before stage is shown
       - no CSS class toggling, no opacity, no z-index tricks
     ============================================================ */
  #video-stage{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    width:100%;
    height:100%;
    background:#000;
    display:none;
    z-index:9000;
    overflow:hidden;
  }
  #success-video{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    width:100%;
    height:100%;
    background:#000;
    display:block;
    object-fit:cover;
    -webkit-user-select:none;
    user-select:none;
  }
  #video-fallback{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    width:100%;
    height:100%;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#7ff0b8;
    font:600 20px/1.5 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.06em;
    text-align:center;
    padding:20px;
    z-index:9001;
    pointer-events:none;
  }
  #sound-hint{
    position:fixed;
    bottom:calc(24px + env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%);
    padding:10px 18px;
    border-radius:999px;
    background:rgba(0,0,0,.68);
    color:#fff;
    font-size:13px;
    letter-spacing:.02em;
    z-index:9002;
    display:none;
    pointer-events:none;
    -webkit-backdrop-filter:blur(8px);
            backdrop-filter:blur(8px);
    box-shadow:0 4px 16px rgba(0,0,0,.4);
  }

  @keyframes spin{ to { transform: rotate(360deg); } }
  @keyframes rise{
    from{ opacity:0; transform:translateY(12px) scale(.98); }
    to  { opacity:1; transform:none; }
  }
  @keyframes pulse{
    0%,100%{ opacity:.55; }
    50%    { opacity:1; }
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    #card{ background:rgba(14,17,22,.78); }
  }
  @media (prefers-reduced-motion:reduce){
    #card, #spinner, #brand .dot, #state::before{ animation:none; }
  }
</style>
</head>
<body>
  <main id="card">
    <div id="brand">
      <img src="icon/jb.png" alt="" width="28" height="28">
      <b>
        <span class="dot"></span>
        <span class="brand-run">Jailbreaking…</span>
        <span class="brand-done">Jailbreak complete</span>
        <span class="brand-fail">Jailbreak failed</span>
      </b>
    </div>

    <div id="status">
      <div id="spinner"></div>
      <svg class="status-svg status-check" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M9 16.6 L14 21.4 L23 11.6" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="status-svg status-fail" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M11 11 L21 21 M21 11 L11 21" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <div id="msg">
      <div class="msg-run">Do not close this page</div>
      <div class="msg-done">Jailbreak complete &mdash; restart your console (do not re-run)</div>
      <div class="msg-fail">Restart your console and try again</div>
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
  </main>

  <!-- Fixed full-viewport stage, exactly like Test G's #fs-stage. -->
  <div id="video-stage">
    <video id="success-video"
           playsinline
           webkit-playsinline
           preload="none"
           disablepictureinpicture
           disableremoteplayback
           controlslist="nodownload nofullscreen noremoteplayback"></video>
  </div>

  <!-- Fallback text — shown only if the video can't play at all. -->
  <div id="video-fallback">Jailbreak Complete</div>

  <div id="sound-hint">Tap for sound</div>

  <script>
    (function () {
      "use strict";

      /* ================================================================
         This script mirrors Test G from the debug suite exactly:
           testFullscreen(url) in test B worked perfectly.
         Key rules derived from the test log:
           1. #card MUST be removeChild'd — not display:none, not hidden.
              Any sibling element (even display:none) can cause the PS4
              WebKit compositor to fight the video (Test H symptom).
           2. video.src is assigned AFTER the stage is visible.
           3. video.muted = false BEFORE play() — JB trigger = user gesture.
           4. Listen for "canplay", then call play(). Nothing before that.
           5. No class toggling on body to control visibility.
      ================================================================ */

      var VIDEO_URL = "media/unshackled.mp4";
      var STATS_KEY = "ps4-jb-stats-v1";

      var card     = document.getElementById("card");
      var stage    = document.getElementById("video-stage");
      var hint     = document.getElementById("sound-hint");
      var fallback = document.getElementById("video-fallback");
      var outEl    = document.getElementById("out");
      var video    = document.getElementById("success-video");

      var counted  = false;
      var started  = false;
      var playing  = false;
      var finished = false;
      var failed   = false;

      /* ---- stats ---- */
      function bumpStats(ok) {
        if (counted) return;
        counted = true;
        try {
          var s = {};
          try { s = JSON.parse(localStorage.getItem(STATS_KEY) || "{}") || {}; } catch(e){}
          s.success = ((s.success | 0) + (ok ? 1 : 0));
          s.failed  = ((s.failed  | 0) + (ok ? 0 : 1));
          s.updatedAt = Date.now();
          localStorage.setItem(STATS_KEY, JSON.stringify(s));
        } catch(e){}
      }

      /* ---- sound hint ---- */
      function showHint() { try { hint.style.display = "block"; } catch(e){} }
      function hideHint() { try { hint.style.display = "none";  } catch(e){} }

      /* ---- fallback text screen ---- */
      function showFallback() {
        if (failed || finished) return;
        failed = true;
        try { video.pause(); } catch(e){}
        try { stage.style.display = "none"; } catch(e){}
        try { fallback.style.display = "flex"; } catch(e){}
        hideHint();
      }

      /* ---- play attempt — mirrors testFullscreen exactly ----
         testFullscreen does:
           fsV.muted = false;
           fsV.volume = 1.0;
           await waitFor(fsV, "canplay", 10000);
           await fsV.play();      // unmuted first
           // if rejected → fsV.muted = true; await fsV.play();
      */
      function attemptPlay() {
        if (finished || failed) return;
        try { video.muted = false; video.volume = 1.0; } catch(e){}
        var p;
        try { p = video.play(); } catch(syncErr) {
          // Synchronous throw — fall back to muted.
          try {
            video.muted = true; showHint();
            var q = video.play();
            if (q && q.then) q.then(function(){ playing = true; }).catch(showFallback);
            else playing = true;
          } catch(e){ showFallback(); }
          return;
        }
        if (p && p.then) {
          p.then(function(){
            playing = true;
            try { if (video.muted) showHint(); else hideHint(); } catch(e){}
          }).catch(function(){
            // Unmuted rejected — retry muted (exactly like testFullscreen).
            try { video.muted = true; showHint(); } catch(e){}
            var q;
            try { q = video.play(); } catch(e){ showFallback(); return; }
            if (q && q.then) q.then(function(){ playing = true; }).catch(showFallback);
            else playing = true;
          });
        } else {
          playing = true;
          try { if (video.muted) showHint(); else hideHint(); } catch(e){}
        }
      }

      /* ---- tap-to-unmute ---- */
      function tryUnmute() {
        if (finished || failed || !video.muted) return;
        try { video.muted = false; video.volume = 1.0; } catch(e){}
        setTimeout(function(){ try { if (!video.muted) hideHint(); } catch(e){} }, 300);
      }
      document.addEventListener("click",      function(){ tryUnmute(); }, true);
      document.addEventListener("touchstart", function(){ tryUnmute(); }, true);
      document.addEventListener("keydown",    function(){ tryUnmute(); }, true);

      /* ---- video events ---- */
      video.addEventListener("playing", function(){ playing = true; });
      video.addEventListener("error",   function(){ if (!finished) showFallback(); });
      video.addEventListener("ended",   function(){ finished = true; hideHint(); try{video.pause();}catch(e){} });

      /* ---- startVideo — mirrors testFullscreen(url) step by step ---- */
      function startVideo() {
        if (started) return;
        started = true;

        /* STEP 1 — physically remove #card from the DOM.
           Test G had NO sibling elements at all. Any sibling —
           even hidden — causes the PS4 compositor to fight the video.
           removeChild is the only way to guarantee zero siblings. */
        try {
          if (card && card.parentNode) card.parentNode.removeChild(card);
        } catch(e){}

        /* STEP 2 — make the stage the only thing on screen. */
        try { stage.style.display = "block"; } catch(e){}

        /* STEP 3 — force layout flush (WebKit needs this). */
        try { void stage.offsetWidth; } catch(e){}

        /* STEP 4 — assign src and load, exactly like testFullscreen:
               fsV.src = url;   (no preload="auto" sneaking data in early) */
        try { video.src = VIDEO_URL; } catch(e){}
        try { video.load(); } catch(e){}

        /* STEP 5 — wait for "canplay" then play, exactly like testFullscreen. */
        var attempted = false;
        function go() {
          if (attempted || playing || finished || failed) return;
          attempted = true;
          attemptPlay();
        }
        video.addEventListener("canplay",    go, { once: true });
        video.addEventListener("loadeddata", go, { once: true });
        setTimeout(go, 1000);   // safety if canplay fires before listener
        setTimeout(go, 3000);   // second safety

        /* STEP 6 — watchdog. */
        setTimeout(function(){
          if (!playing && !finished && !failed) showFallback();
        }, 20000);
      }

      /* ---- success / failure detection ---- */
      function evaluate() {
        try {
          if (document.body.classList.contains("done")) {
            bumpStats(true); startVideo(); return;
          }
          if (document.body.classList.contains("fail")) {
            bumpStats(false); return;
          }
          if (outEl) {
            var txt = outEl.textContent || "";
            if (/PROOF-SUMMARY-FINAL/.test(txt)) {
              if (/INCOMPLETE/.test(txt)) {
                bumpStats(false);
              } else if (/PAYLOAD-RUNNING/.test(txt) ||
                         /PROOF-OK\s+PAYLOAD-RUNNING/.test(txt)) {
                bumpStats(true); startVideo();
              }
            }
          }
        } catch(e){}
      }

      /* Watch body class changes (done / fail). */
      try {
        new MutationObserver(evaluate).observe(document.body, {
          attributes: true, attributeFilter: ["class"]
        });
      } catch(e){}
      /* Watch log output. */
      if (outEl) {
        try {
          new MutationObserver(evaluate).observe(outEl, {
            childList: true, subtree: true, characterData: true
          });
        } catch(e){}
      }
      evaluate();

      /* Gentle retry — stalled video nudge. */
      setInterval(function(){
        evaluate();
        if (finished) return;
        if (started && !playing && !failed && video.src && video.paused) attemptPlay();
      }, 5000);

      video.addEventListener("contextmenu", function(e){
        try { e.preventDefault(); } catch(e2){}
        return false;
      });

    })();
  </script>
  <script type="module">
    import "./jb.js?v=10";
  </script>
</body>
</html>
