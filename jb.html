<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Jailbreak</title>
<style>
  *{ box-sizing:border-box; }

  html{ height:100%; background:#08090c; }

  /* Background photo + vignette. Both are killed the instant we enter
     video mode, because a fixed-position compositing layer stacked
     beneath a playing video makes PS4 WebKit render the video black. */
  html::before{
    content:"";
    position:fixed; inset:0;
    background:url("background/bg.png") center / cover no-repeat;
    z-index:-2;
  }
  html::after{
    content:"";
    position:fixed; inset:0;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,.06) 0%, rgba(0,0,0,.45) 100%);
    z-index:-1;
    pointer-events:none;
  }
  html.video-mode::before,
  html.video-mode::after{ display:none !important; }
  html.video-mode{ background:#000 !important; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
      calc(24px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
    color:#eef2f7;
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body.video-mode{
    padding:0 !important;
    display:block !important;
    background:#000 !important;
    min-height:100vh !important;
  }

  #card{
    position:relative;
    z-index:10;
    width:min(92vw, 440px);
    border-radius:20px;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.13);
    -webkit-backdrop-filter:blur(22px) saturate(170%);
            backdrop-filter:blur(22px) saturate(170%);
    box-shadow:
      0 24px 60px rgba(0,0,0,.42),
      0 2px 8px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.20);
    overflow:hidden;
    animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
  }
  #card::after{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(180deg,
      rgba(255,255,255,.08), rgba(255,255,255,0) 45%);
  }
  body.video-mode #card{
    display:none !important;
    animation:none !important;
  }

  #brand{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid rgba(255,255,255,.10);
    background:rgba(0,0,0,.16);
    z-index:1;
  }
  #brand img{
    width:28px; height:28px;
    border-radius:50%;
    flex:0 0 auto;
  }
  #brand b{
    font-size:15px;
    font-weight:700;
    letter-spacing:.10em;
    color:#e6ebf2;
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
    min-width:0;
  }
  #brand .dot{
    width:9px; height:9px;
    border-radius:50%;
    background:#ffd894;
    box-shadow:0 0 12px #ffd894;
    animation: pulse 1.5s ease-in-out infinite;
    flex:0 0 auto;
  }
  .brand-run  { display:inline; }
  .brand-done { display:none;  color:#7ff0b8; }
  .brand-fail { display:none;  color:#ff9d9d; }
  body.done #brand .dot{ background:#7ff0b8; box-shadow:0 0 12px #7ff0b8; animation:none; }
  body.fail #brand .dot{ background:#ff9d9d; box-shadow:0 0 12px #ff9d9d; animation:none; }
  body.done .brand-run  { display:none; }
  body.done .brand-done { display:inline; }
  body.fail .brand-run  { display:none; }
  body.fail .brand-fail { display:inline; }

  #status{
    position:relative;
    width:64px;
    height:64px;
    margin:30px auto 22px;
  }
  #spinner{
    position:absolute;
    top:0; left:0;
    width:64px; height:64px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.10);
    border-top-color:#7ff0b8;
    border-right-color:rgba(127,240,184,.55);
    animation: spin .9s linear infinite;
    filter: drop-shadow(0 0 14px rgba(127,240,184,.35));
  }
  .status-svg{
    display:none;
    position:absolute;
    top:0; left:0;
    width:64px; height:64px;
  }
  .status-check{ color:#7ff0b8; filter: drop-shadow(0 0 14px rgba(127,240,184,.55)); }
  .status-fail { color:#ff9d9d; filter: drop-shadow(0 0 14px rgba(255,120,120,.55)); }
  body.done #spinner{ display:none; }
  body.done .status-check{ display:block; }
  body.fail #spinner{ display:none; }
  body.fail .status-fail{ display:block; }

  #msg{
    display:block;
    text-align:center;
    padding:0 24px 26px;
    font-size:15px;
    line-height:1.4;
  }
  #msg .msg-run  { display:block; color:rgba(238,242,247,.70); }
  #msg .msg-done { display:none;  color:#7ff0b8; text-shadow:0 0 24px rgba(127,240,184,.45); }
  #msg .msg-fail { display:none;  color:#ff9d9d; text-shadow:0 0 24px rgba(255,120,120,.45); }
  body.done #msg .msg-run { display:none; }
  body.done #msg .msg-done{ display:block; }
  body.fail #msg .msg-run { display:none; }
  body.fail #msg .msg-fail{ display:block; }

  #wrap{ display:none; position:relative; z-index:1; }
  body.log{ align-items:flex-start; }
  body.log #status,
  body.log #msg{ display:none !important; }
  body.log #card{
    width:min(94vw, 760px);
    display:flex;
    flex-direction:column;
    max-height: calc(100vh - 48px);
    margin:0 auto;
  }
  body.log #wrap{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    padding:16px 18px;
    gap:12px;
  }
  #state{
    display:none;
    font-size:17px;
    font-weight:650;
    letter-spacing:.01em;
    line-height:1.35;
    color:#eef2f7;
  }
  body.log #state{ display:block; }
  #state.ok  { color:#7ff0b8; }
  #state.warn{ color:#ffd894; }
  #state.bad { color:#ff9d9d; }
  #state::before{
    content:"";
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background:currentColor;
    margin-right:10px;
    vertical-align:middle;
    box-shadow:0 0 12px currentColor;
    animation: pulse 1.6s ease-in-out infinite;
  }
  #out{
    flex:1;
    min-height:0;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font:12px/1.55 ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
    padding:14px 16px;
    border-radius:12px;
    background:rgba(6,8,12,.42);
    border:1px solid rgba(255,255,255,.07);
    color:rgba(238,242,247,.88);
    scrollbar-width:thin;
    scrollbar-color: rgba(255,255,255,.22) transparent;
    overscroll-behavior:contain;
  }

  /* ---- VIDEO ----
     Inline styles get applied from JS the moment we go into video mode.
     These defaults keep it alive in the compositor while the card is up. */
  #success-video{
    position:fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    object-fit:contain;
    background:#000;
    z-index:-5;
    opacity:0;
    display:block;
    pointer-events:none;
    -webkit-user-select:none;
    user-select:none;
  }

  #sound-hint{
    position:fixed;
    bottom:calc(24px + env(safe-area-inset-bottom));
    left:50%;
    transform: translateX(-50%);
    padding:10px 18px;
    border-radius:999px;
    background:rgba(0,0,0,.68);
    color:#fff;
    font-size:13px;
    letter-spacing:.02em;
    z-index:2147483647;
    display:none;
    pointer-events:none;
    -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  body.video-muted #sound-hint{ display:block; animation: pulse 1.6s ease-in-out infinite; }

  @keyframes spin{ to { transform: rotate(360deg); } }
  @keyframes rise{
    from{ opacity:0; transform:translateY(12px) scale(.98); }
    to  { opacity:1; transform:none; }
  }
  @keyframes pulse{
    0%,100%{ opacity:.55; }
    50%    { opacity:1; }
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    #card{ background:rgba(14,17,22,.78); }
  }
  @media (prefers-reduced-motion:reduce){
    #card, #spinner, #brand .dot, #state::before{ animation:none; }
    body.video-muted #sound-hint{ animation:none; }
  }
</style>
</head>
<body>
  <main id="card">
    <div id="brand">
      <img src="icon/jb.png" alt="" width="28" height="28">
      <b>
        <span class="dot"></span>
        <span class="brand-run">Jailbreaking…</span>
        <span class="brand-done">Jailbreak complete</span>
        <span class="brand-fail">Jailbreak failed</span>
      </b>
    </div>

    <div id="status">
      <div id="spinner"></div>
      <svg class="status-svg status-check" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M9 16.6 L14 21.4 L23 11.6" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="status-svg status-fail" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M11 11 L21 21 M21 11 L11 21" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <div id="msg">
      <div class="msg-run">Do not close this page</div>
      <div class="msg-done">Jailbreak complete &mdash; restart your console (do not re-run)</div>
      <div class="msg-fail">Restart your console and try again</div>
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
  </main>

  <video id="success-video"
         preload="auto"
         playsinline
         webkit-playsinline
         x5-playsinline
         disablepictureinpicture
         disableremoteplayback
         controlslist="nodownload nofullscreen noremoteplayback"
         muted>
    <source src="media/unshackled.mp4" type="video/mp4; codecs=&quot;avc1.42E01E, mp4a.40.2&quot;">
    <source src="media/unshackled.mp4" type="video/mp4">
  </video>

  <div id="sound-hint">Tap for sound</div>

  <script>
    (function () {
      var STATS_KEY = "ps4-jb-stats-v1";
      var video = document.getElementById("success-video");

      var counted = false;
      var started = false;
      var playing = false;
      var finished = false;
      var failed  = false;

      function hasClass(c, el){ try { return (el||document.body).classList.contains(c); } catch (e) { return false; } }
      function addClass(c, el){ try { (el||document.body).classList.add(c); } catch (e) {} }
      function removeClass(c, el){ try { (el||document.body).classList.remove(c); } catch (e) {} }

      function bumpStats(ok) {
        if (counted) return;
        counted = true;
        try {
          var raw = localStorage.getItem(STATS_KEY) || "";
          var s = {};
          if (raw) { try { s = JSON.parse(raw) || {}; } catch (e) { s = {}; } }
          if (!s || typeof s !== "object") s = {};
          var success = (typeof s.success === "number" && s.success >= 0) ? (s.success | 0) : 0;
          var failedN = (typeof s.failed  === "number" && s.failed  >= 0) ? (s.failed  | 0) : 0;
          if (ok) success++; else failedN++;
          localStorage.setItem(STATS_KEY, JSON.stringify({
            success: success, failed: failedN, updatedAt: Date.now()
          }));
        } catch (e) {}
      }

      function showSoundHint(){ addClass("video-muted"); }
      function hideSoundHint(){ removeClass("video-muted"); }
      function tryUnmute() {
        try { video.muted = false; video.volume = 1.0; } catch (e) {}
        setTimeout(function () {
          if (video.muted) showSoundHint();
          else hideSoundHint();
        }, 300);
      }

      // Fallback if the video truly can't play. Rebuild the card view.
      function fallbackToCard() {
        if (failed) return;
        failed = true;
        try { video.pause(); } catch (e) {}
        removeClass("video-mode", document.documentElement);
        removeClass("video-mode");
        removeClass("video-muted");
        // Reinstate the done state visuals.
        if (hasClass("done") || hasClass("log")) {
          addClass("done");
        }
      }

      function tryPlay() {
        if (finished || failed) return;

        // First attempt: unmuted. PS4 WebKit allows unmuted autoplay when
        // the page was entered via a user gesture (which it was, since the
        // user pressed X on index.html to launch jb.html).
        try { video.muted = false; video.volume = 1.0; } catch (e) {}

        var p;
        try { p = video.play(); }
        catch (e) {
          // Synchronous throw -- fall back to muted play.
          try { video.muted = true; video.play(); showSoundHint(); }
          catch (e2) { fallbackToCard(); }
          return;
        }
        if (p && typeof p.then === "function") {
          p.catch(function () {
            // Autoplay-with-sound was rejected. Start muted then unmute.
            try { video.muted = true; } catch (e) {}
            var q;
            try { q = video.play(); }
            catch (e) { fallbackToCard(); return; }
            if (q && typeof q.then === "function") {
              q.then(function () { tryUnmute(); })
               .catch(function () { fallbackToCard(); });
            }
          });
        }
      }

      video.addEventListener("playing", function () {
        playing = true;
        if (video.muted) tryUnmute();
      });
      video.addEventListener("error", function () { fallbackToCard(); });
      video.addEventListener("ended", function () {
        finished = true;
        try { video.pause(); } catch (e) {}
      });

      document.addEventListener("click", function () {
        if (!started || finished) return;
        if (video.muted) tryUnmute();
      }, true);

      try { video.load(); } catch (e) {}

      // ---- THE FIX ----
      function startVideo() {
        if (started) return;
        started = true;

        // 1. Nuke every compositing layer above / around the video.
        addClass("video-mode", document.documentElement);
        addClass("video-mode");

        // 2. Give the video explicit inline styles. Inline wins over
        //    stylesheet rules so nothing can interfere with the layout
        //    the compositor needs.
        video.style.position = "fixed";
        video.style.top = "0";
        video.style.left = "0";
        video.style.width = "100vw";
        video.style.height = "100vh";
        video.style.objectFit = "contain";
        video.style.background = "#000";
        video.style.zIndex = "2147483647";
        video.style.opacity = "1";
        video.style.display = "block";
        video.style.visibility = "visible";
        video.style.pointerEvents = "auto";

        // 3. Force a layout flush so the browser actually sees a painted
        //    full-screen video before we ask it to play.
        void video.offsetWidth;
        void document.body.offsetWidth;

        // 4. Double rAF: wait for layout + paint, THEN play.
        var playNow = function () {
          try { video.currentTime = 0; } catch (e) {}
          tryPlay();

          // Watchdog: if nothing has started after 6 s, give up.
          setTimeout(function () {
            if (!playing && !finished) fallbackToCard();
          }, 6000);
        };

        requestAnimationFrame(function () {
          requestAnimationFrame(playNow);
        });
      }

      function evaluate() {
        if (hasClass("done")) { bumpStats(true); startVideo(); return; }
        if (hasClass("fail")) { bumpStats(false); return; }
        var outEl = document.getElementById("out");
        if (outEl) {
          var txt = outEl.textContent || "";
          if (/PROOF-SUMMARY-FINAL/.test(txt)) {
            if (/INCOMPLETE/.test(txt)) { bumpStats(false); }
            else if (/PAYLOAD-RUNNING/.test(txt) || /PROOF-OK\s+PAYLOAD-RUNNING/.test(txt)) {
              bumpStats(true);
              if (!hasClass("log")) startVideo();
            }
          }
        }
      }

      try {
        new MutationObserver(evaluate).observe(document.body, {
          attributes: true, attributeFilter: ["class"]
        });
      } catch (e) {}
      var outEl = document.getElementById("out");
      if (outEl) {
        try {
          new MutationObserver(evaluate).observe(outEl, {
            childList: true, subtree: true, characterData: true
          });
        } catch (e) {}
      }
      evaluate();

      setInterval(function () {
        evaluate();
        if (finished || video.ended) { finished = true; return; }
        if (started && !playing && video.paused && !failed) tryPlay();
      }, 4000);

      video.addEventListener("contextmenu", function (e) {
        e.preventDefault();
        return false;
      });
    })();
  </script>
  <script type="module">
    import "./jb.js?v=10";
  </script>
</body>
</html>
