<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Jailbreak</title>
<style>
  *{ box-sizing:border-box; }
  html{ height:100%; background:#08090c; }
  html::before{
    content:"";
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:url("background/bg.png") center / cover no-repeat;
    z-index:0;
  }
  html::after{
    content:"";
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,.06) 0%, rgba(0,0,0,.45) 100%);
    z-index:1;
    pointer-events:none;
  }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
      calc(24px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
    color:#eef2f7;
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
    z-index:2;
  }
  #card{
    position:relative;
    z-index:10;
    width:min(92vw, 440px);
    border-radius:20px;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.13);
    -webkit-backdrop-filter:blur(22px) saturate(170%);
            backdrop-filter:blur(22px) saturate(170%);
    box-shadow:
      0 24px 60px rgba(0,0,0,.42),
      0 2px 8px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.20);
    overflow:hidden;
    animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
  }
  #card::after{
    content:"";
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(180deg,
      rgba(255,255,255,.08), rgba(255,255,255,0) 45%);
  }
  #brand{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid rgba(255,255,255,.10);
    background:rgba(0,0,0,.16);
    z-index:1;
  }
  #brand img{
    width:28px; height:28px;
    border-radius:50%;
    flex:0 0 auto;
  }
  #brand b{
    font-size:15px;
    font-weight:700;
    letter-spacing:.10em;
    color:#e6ebf2;
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
    min-width:0;
  }
  #brand .dot{
    width:9px; height:9px;
    border-radius:50%;
    background:#ffd894;
    box-shadow:0 0 12px #ffd894;
    animation: pulse 1.5s ease-in-out infinite;
    flex:0 0 auto;
  }
  .brand-run  { display:inline; }
  .brand-done { display:none;  color:#7ff0b8; }
  .brand-fail { display:none;  color:#ff9d9d; }
  body.done #brand .dot{ background:#7ff0b8; box-shadow:0 0 12px #7ff0b8; animation:none; }
  body.fail #brand .dot{ background:#ff9d9d; box-shadow:0 0 12px #ff9d9d; animation:none; }
  body.done .brand-run  { display:none; }
  body.done .brand-done { display:inline; }
  body.fail .brand-run  { display:none; }
  body.fail .brand-fail { display:inline; }
  #status{
    position:relative;
    width:64px;
    height:64px;
    margin:30px auto 22px;
  }
  #spinner{
    position:absolute;
    top:0; left:0;
    width:64px; height:64px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.10);
    border-top-color:#7ff0b8;
    border-right-color:rgba(127,240,184,.55);
    animation: spin .9s linear infinite;
    filter: drop-shadow(0 0 14px rgba(127,240,184,.35));
  }
  .status-svg{
    display:none;
    position:absolute;
    top:0; left:0;
    width:64px; height:64px;
  }
  .status-check{ color:#7ff0b8; filter: drop-shadow(0 0 14px rgba(127,240,184,.55)); }
  .status-fail { color:#ff9d9d; filter: drop-shadow(0 0 14px rgba(255,120,120,.55)); }
  body.done #spinner{ display:none; }
  body.done .status-check{ display:block; }
  body.fail #spinner{ display:none; }
  body.fail .status-fail{ display:block; }
  #msg{
    display:block;
    text-align:center;
    padding:0 24px 26px;
    font-size:15px;
    line-height:1.4;
  }
  #msg .msg-run  { display:block; color:rgba(238,242,247,.70); }
  #msg .msg-done { display:none;  color:#7ff0b8; text-shadow:0 0 24px rgba(127,240,184,.45); }
  #msg .msg-fail { display:none;  color:#ff9d9d; text-shadow:0 0 24px rgba(255,120,120,.45); }
  body.done #msg .msg-run { display:none; }
  body.done #msg .msg-done{ display:block; }
  body.fail #msg .msg-run { display:none; }
  body.fail #msg .msg-fail{ display:block; }
  #wrap{ display:none; position:relative; z-index:1; }
  body.log{ align-items:flex-start; }
  body.log #status,
  body.log #msg{ display:none !important; }
  body.log #card{
    width:min(94vw, 760px);
    display:flex;
    flex-direction:column;
    max-height: calc(100vh - 48px);
    margin:0 auto;
  }
  body.log #wrap{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    padding:16px 18px;
    gap:12px;
  }
  #state{
    display:none;
    font-size:17px;
    font-weight:650;
    letter-spacing:.01em;
    line-height:1.35;
    color:#eef2f7;
  }
  body.log #state{ display:block; }
  #state.ok  { color:#7ff0b8; }
  #state.warn{ color:#ffd894; }
  #state.bad { color:#ff9d9d; }
  #state::before{
    content:"";
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background:currentColor;
    margin-right:10px;
    vertical-align:middle;
    box-shadow:0 0 12px currentColor;
    animation: pulse 1.6s ease-in-out infinite;
  }
  #out{
    flex:1;
    min-height:0;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font:12px/1.55 ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
    padding:14px 16px;
    border-radius:12px;
    background:rgba(6,8,12,.42);
    border:1px solid rgba(255,255,255,.07);
    color:rgba(238,242,247,.88);
    scrollbar-width:thin;
    scrollbar-color: rgba(255,255,255,.22) transparent;
    overscroll-behavior:contain;
  }

  /* ============================================================
     VIDEO STAGE — mirrors Test G exactly:
     - plain fixed full-viewport div, black bg
     - toggled by display:none / display:block only
     - #card is REMOVED from DOM entirely before video plays
     - no opacity tricks, no z-index games, no siblings
     ============================================================ */
  #video-stage{
    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    width:100%; height:100%;
    background:#000;
    z-index:9999;
    overflow:hidden;
  }
  #success-video{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    background:#000;
    object-fit:cover;
    display:block;
  }

  /* Fallback text shown if video can't play */
  #video-fallback{
    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#7ff0b8;
    font:600 20px/1.5 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.06em;
    text-align:center;
    padding:20px;
    z-index:9999;
  }

  /* Sound hint pill */
  #sound-hint{
    position:fixed;
    bottom:calc(24px + env(safe-area-inset-bottom));
    left:50%;
    transform: translateX(-50%);
    padding:10px 18px;
    border-radius:999px;
    background:rgba(0,0,0,.68);
    color:#fff;
    font-size:13px;
    letter-spacing:.02em;
    z-index:10000;
    display:none;
    pointer-events:none;
    -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }

  @keyframes spin{ to { transform: rotate(360deg); } }
  @keyframes rise{
    from{ opacity:0; transform:translateY(12px) scale(.98); }
    to  { opacity:1; transform:none; }
  }
  @keyframes pulse{
    0%,100%{ opacity:.55; }
    50%    { opacity:1; }
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    #card{ background:rgba(14,17,22,.78); }
  }
  @media (prefers-reduced-motion:reduce){
    #card, #spinner, #brand .dot, #state::before{ animation:none; }
  }
</style>
</head>
<body>
  <main id="card">
    <div id="brand">
      <img src="icon/jb.png" alt="" width="28" height="28">
      <b>
        <span class="dot"></span>
        <span class="brand-run">Jailbreaking…</span>
        <span class="brand-done">Jailbreak complete</span>
        <span class="brand-fail">Jailbreak failed</span>
      </b>
    </div>

    <div id="status">
      <div id="spinner"></div>
      <svg class="status-svg status-check" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M9 16.6 L14 21.4 L23 11.6" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="status-svg status-fail" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M11 11 L21 21 M21 11 L11 21" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <div id="msg">
      <div class="msg-run">Do not close this page</div>
      <div class="msg-done">Jailbreak complete &mdash; restart your console (do not re-run)</div>
      <div class="msg-fail">Restart your console and try again</div>
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
  </main>

  <!--
    Video stage is a DIRECT child of <body>, NOT inside #card.
    It starts hidden. When success fires:
      1. #card is physically removed from the DOM
      2. #video-stage is set to display:block
      3. video.src is assigned and play() is called
    This exactly mirrors Test G (video alone, no sibling elements).
  -->
  <div id="video-stage">
    <video id="success-video"
           playsinline
           webkit-playsinline
           preload="none"
           disablepictureinpicture
           disableremoteplayback
           controlslist="nodownload nofullscreen noremoteplayback"
           x-webkit-airplay="deny"></video>
  </div>

  <div id="video-fallback">Jailbreak Complete</div>

  <div id="sound-hint">Tap for sound</div>

  <script>
    (function () {
      "use strict";

      var VIDEO_URL = "media/unshackled.mp4";
      var STATS_KEY = "ps4-jb-stats-v1";

      var card     = document.getElementById("card");
      var stage    = document.getElementById("video-stage");
      var video    = document.getElementById("success-video");
      var fallback = document.getElementById("video-fallback");
      var hint     = document.getElementById("sound-hint");
      var outEl    = document.getElementById("out");

      var counted  = false;
      var started  = false;
      var playing  = false;
      var finished = false;
      var hasFailed = false;

      // ---- stats ----
      function bumpStats(ok) {
        if (counted) return;
        counted = true;
        try {
          var raw = localStorage.getItem(STATS_KEY) || "";
          var s = {};
          if (raw) { try { s = JSON.parse(raw) || {}; } catch (e) { s = {}; } }
          if (!s || typeof s !== "object") s = {};
          var succ = (typeof s.success === "number") ? (s.success | 0) : 0;
          var fail = (typeof s.failed  === "number") ? (s.failed  | 0) : 0;
          if (ok) succ++; else fail++;
          localStorage.setItem(STATS_KEY, JSON.stringify({
            success: succ, failed: fail, updatedAt: Date.now()
          }));
        } catch (e) {}
      }

      // ---- sound hint ----
      function showHint() { try { hint.style.display = "block"; } catch(e){} }
      function hideHint() { try { hint.style.display = "none";  } catch(e){} }

      function tryUnmute() {
        try { video.muted = false; video.volume = 1.0; } catch (e) {}
        setTimeout(function () {
          try { if (!video.muted) hideHint(); } catch(e){}
        }, 300);
      }

      // ---- fallback to text ----
      function showFallback() {
        if (hasFailed || finished) return;
        hasFailed = true;
        try { video.pause(); } catch(e){}
        try { stage.style.display = "none"; } catch(e){}
        try { fallback.style.display = "flex"; } catch(e){}
        hideHint();
      }

      // ---- attempt play — unmuted first (JB trigger = user gesture) ----
      function attemptPlay() {
        if (finished || hasFailed) return;
        // Always try unmuted first — the jailbreak button click IS a user gesture
        try { video.muted = false; video.volume = 1.0; } catch(e){}
        var p;
        try { p = video.play(); } catch(e) {
          // Synchronous exception — go muted
          try { video.muted = true; showHint(); p = video.play(); } catch(e2) {
            showFallback(); return;
          }
        }
        if (p && typeof p.then === "function") {
          p.then(function() {
            playing = true;
            // Successfully playing — check if still unmuted
            try { if (video.muted) showHint(); else hideHint(); } catch(e){}
          }).catch(function() {
            // Unmuted play rejected — retry muted
            try {
              video.muted = true;
              showHint();
              var q = video.play();
              if (q && typeof q.then === "function") {
                q.then(function() { playing = true; })
                 .catch(function() { showFallback(); });
              } else {
                playing = true;
              }
            } catch(e) { showFallback(); }
          });
        } else {
          playing = true;
          try { if (video.muted) showHint(); } catch(e){}
        }
      }

      // ---- video event listeners ----
      video.addEventListener("playing", function() {
        playing = true;
      });
      video.addEventListener("error", function() {
        if (!finished) showFallback();
      });
      video.addEventListener("ended", function() {
        finished = true;
        hideHint();
        try { video.pause(); } catch(e){}
      });

      // Tap anywhere to unmute if still muted
      document.addEventListener("click",      function() { if (!finished && !hasFailed && video.muted) tryUnmute(); }, true);
      document.addEventListener("touchstart", function() { if (!finished && !hasFailed && video.muted) tryUnmute(); }, true);
      document.addEventListener("keydown",    function() { if (!finished && !hasFailed && video.muted) tryUnmute(); }, true);

      // ---- THE CRITICAL START FUNCTION ----
      // Mirrors Test G: video alone, no siblings.
      function startVideo() {
        if (started) return;
        started = true;

        // STEP 1: Remove the card from the DOM entirely.
        // This is the key difference from Test H (which kept card as a sibling).
        // Test G had NO sibling elements — this is how we replicate that.
        try {
          if (card && card.parentNode) {
            card.parentNode.removeChild(card);
          }
        } catch(e){}

        // STEP 2: Show the stage (now the only element on screen).
        try { stage.style.display = "block"; } catch(e){}

        // STEP 3: Force layout flush so WebKit registers the stage.
        try { void stage.offsetWidth; } catch(e){}

        // STEP 4: Assign src and load — exactly like Test G did.
        try {
          video.src = VIDEO_URL;
          video.load();
        } catch(e){}

        // STEP 5: Play on canplay (same as Test G's flow).
        var attempted = false;
        function go() {
          if (attempted || playing || finished || hasFailed) return;
          attempted = true;
          attemptPlay();
        }

        video.addEventListener("canplay",    go, { once: true });
        video.addEventListener("loadeddata", go, { once: true });

        // Safety timeouts in case events don't fire
        setTimeout(go, 800);
        setTimeout(go, 2500);

        // Watchdog: if nothing plays in 15s, show fallback
        setTimeout(function() {
          if (!playing && !finished && !hasFailed) showFallback();
        }, 15000);
      }

      // ---- success / failure detection ----
      function evaluate() {
        try {
          if (document.body.classList.contains("done")) {
            bumpStats(true);
            startVideo();
            return;
          }
          if (document.body.classList.contains("fail")) {
            bumpStats(false);
            return;
          }
          if (outEl) {
            var txt = outEl.textContent || "";
            if (/PROOF-SUMMARY-FINAL/.test(txt)) {
              if (/INCOMPLETE/.test(txt)) {
                bumpStats(false);
              } else if (/PAYLOAD-RUNNING/.test(txt) ||
                         /PROOF-OK\s+PAYLOAD-RUNNING/.test(txt)) {
                bumpStats(true);
                startVideo();
              }
            }
          }
        } catch(e){}
      }

      // Watch for class changes on body
      try {
        new MutationObserver(evaluate).observe(document.body, {
          attributes: true, attributeFilter: ["class"]
        });
      } catch(e){}

      // Watch for log output changes
      if (outEl) {
        try {
          new MutationObserver(evaluate).observe(outEl, {
            childList: true, subtree: true, characterData: true
          });
        } catch(e){}
      }

      evaluate();

      // Gentle retry loop
      setInterval(function() {
        evaluate();
        if (finished || (video.src && video.ended)) { finished = true; return; }
        // If stage is visible and video is stalled, nudge it
        if (started && !playing && !hasFailed && !finished && video.src && video.paused) {
          attemptPlay();
        }
      }, 4000);

      video.addEventListener("contextmenu", function(e) {
        try { e.preventDefault(); } catch(e2){}
        return false;
      });

    })();
  </script>
  <script type="module">
    import "./jb.js?v=10";
  </script>
</body>
</html>
