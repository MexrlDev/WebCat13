<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Jailbreak</title>
<style>
  *{ box-sizing:border-box; }

  html{ height:100%; background:#08090c; }

  html::before{
    content:"";
    position:fixed;
    inset:0;
    background:url("background/bg.png") center / cover no-repeat;
    z-index:-2;
  }
  html::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,.06) 0%, rgba(0,0,0,.45) 100%);
    z-index:-1;
    pointer-events:none;
  }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
      calc(24px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
    color:#eef2f7;
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition: align-items .35s ease;
  }

  /* ---- glass rectangle ---- */
  #card{
    position:relative;
    width:min(92vw, 440px);
    border-radius:20px;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.13);
    -webkit-backdrop-filter:blur(22px) saturate(170%);
            backdrop-filter:blur(22px) saturate(170%);
    box-shadow:
      0 24px 60px rgba(0,0,0,.42),
      0 2px 8px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.20);
    overflow:hidden;
    animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
    transition: width .35s ease;
  }
  #card::after{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(180deg,
      rgba(255,255,255,.08), rgba(255,255,255,0) 45%);
  }

  /* ---- brand / header ---- */
  #brand{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid rgba(255,255,255,.10);
    background:rgba(0,0,0,.16);
    z-index:1;
  }
  #brand img{
    width:28px; height:28px;
    border-radius:50%;
    flex:0 0 auto;
  }
  #brand b{
    font-size:15px;
    font-weight:700;
    letter-spacing:.10em;
    color:#e6ebf2;
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
    min-width:0;
  }
  #brand .dot{
    width:9px; height:9px;
    border-radius:50%;
    background:#ffd894;
    box-shadow:0 0 12px #ffd894;
    animation: pulse 1.5s ease-in-out infinite;
    flex:0 0 auto;
  }
  .brand-run  { display:inline; }
  .brand-done { display:none;  color:#7ff0b8; }
  .brand-fail { display:none;  color:#ff9d9d; }
  body.done #brand .dot{ background:#7ff0b8; box-shadow:0 0 12px #7ff0b8; animation:none; }
  body.fail #brand .dot{ background:#ff9d9d; box-shadow:0 0 12px #ff9d9d; animation:none; }
  body.done .brand-run  { display:none; }
  body.done .brand-done { display:inline; }
  body.fail .brand-run  { display:none; }
  body.fail .brand-fail { display:inline; }

  /* ---------- status circle (spinner / check / X) ---------- */
  #status{
    position:relative;
    width:64px;
    height:64px;
    margin:30px auto 22px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #spinner{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.10);
    border-top-color:#7ff0b8;
    border-right-color:rgba(127,240,184,.55);
    animation: spin .9s linear infinite;
    filter: drop-shadow(0 0 14px rgba(127,240,184,.35));
  }
  .status-svg{
    display:none;
    width:64px;
    height:64px;
    position:absolute;
    inset:0;
  }
  .status-check{ color:#7ff0b8; filter: drop-shadow(0 0 14px rgba(127,240,184,.55)); }
  .status-fail { color:#ff9d9d; filter: drop-shadow(0 0 14px rgba(255,120,120,.55)); }

  body.done #spinner{ display:none; }
  body.done .status-check{ display:block; }
  body.fail #spinner{ display:none; }
  body.fail .status-fail{ display:block; }

  /* --------- result message ---------- */
  #msg{
    display:none;
    text-align:center;
    padding:0 24px 26px;
    font-size:15px;
    line-height:1.4;
  }
  #msg .msg-run  { display:none;  color:rgba(238,242,247,.70); }
  #msg .msg-done { display:none;  color:#7ff0b8; text-shadow:0 0 24px rgba(127,240,184,.45); }
  #msg .msg-fail { display:none;  color:#ff9d9d; text-shadow:0 0 24px rgba(255,120,120,.45); }

  body.done #msg{ display:block; }
  body.done #msg .msg-done{ display:block; }
  body.fail #msg{ display:block; }
  body.fail #msg .msg-fail{ display:block; }

  /* --------- live log view (body.log) ---------- */
  #wrap{ display:none; position:relative; z-index:1; }

  body.log{ align-items:flex-start; }
  body.log #status,
  body.log #msg{ display:none !important; }
  body.log #card{
    width:min(94vw, 760px);
    display:flex;
    flex-direction:column;
    max-height: calc(100vh - 48px);
    margin:0 auto;
  }
  body.log #wrap{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    padding:16px 18px;
    gap:12px;
  }

  #state{
    display:none;
    font-size:17px;
    font-weight:650;
    letter-spacing:.01em;
    line-height:1.35;
    color:#eef2f7;
  }
  body.log #state{ display:block; }
  #state.ok  { color:#7ff0b8; }
  #state.warn{ color:#ffd894; }
  #state.bad { color:#ff9d9d; }
  #state::before{
    content:"";
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background:currentColor;
    margin-right:10px;
    vertical-align:middle;
    box-shadow:0 0 12px currentColor;
    animation: pulse 1.6s ease-in-out infinite;
  }

  #out{
    flex:1;
    min-height:0;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font:12px/1.55 ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
    padding:14px 16px;
    border-radius:12px;
    background:rgba(6,8,12,.42);
    border:1px solid rgba(255,255,255,.07);
    color:rgba(238,242,247,.88);
    scrollbar-width:thin;
    scrollbar-color: rgba(255,255,255,.22) transparent;
    overscroll-behavior:contain;
  }
  #out::-webkit-scrollbar{ width:9px; }
  #out::-webkit-scrollbar-track{ background:transparent; }
  #out::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.16);
    border-radius:6px;
    border:2px solid transparent;
    background-clip:content-box;
  }
  #out::-webkit-scrollbar-thumb:hover{
    background:rgba(255,255,255,.28);
    background-clip:content-box;
  }

  #out .ok,  #out .safe   { color:#7ff0b8; }
  #out .bad, #out .danger { color:#ff9d9d; }
  #out .warn              { color:#ffd894; }
  #out code               { color:#a8c4ff; }

  /* --------- full-screen success video ---------- */
  #success-video{
    position:fixed;
    top:0; left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    background:#000;
    z-index:2147483647;
    display:none;
    pointer-events:none;
    -webkit-user-select:none;
    user-select:none;
  }
  body.done #success-video{ display:block; }
  body.done #card{ display:none; }

  /* --------- animations & fallbacks ---------- */
  @keyframes spin{ to { transform: rotate(360deg); } }
  @keyframes rise{
    from{ opacity:0; transform:translateY(12px) scale(.98); }
    to  { opacity:1; transform:none; }
  }
  @keyframes pulse{
    0%,100%{ opacity:.55; }
    50%    { opacity:1; }
  }

  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    #card{ background:rgba(14,17,22,.78); }
  }
  @media (prefers-reduced-motion:reduce){
    #card, #spinner, #brand .dot, #state::before{ animation:none; }
  }
</style>
</head>
<body>
  <main id="card">
    <div id="brand">
      <img src="icon/jb.png" alt="" width="28" height="28">
      <b>
        <span class="dot"></span>
        <span class="brand-run">Jailbreaking…</span>
        <span class="brand-done">Jailbreak complete</span>
        <span class="brand-fail">Jailbreak failed</span>
      </b>
    </div>

    <div id="status">
      <div id="spinner"></div>

      <svg class="status-svg status-check" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5"
                fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M9 16.6 L14 21.4 L23 11.6"
              fill="none" stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"/>
      </svg>

      <svg class="status-svg status-fail" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5"
                fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M11 11 L21 21 M21 11 L11 21"
              fill="none" stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"/>
      </svg>
    </div>

    <div id="msg">
      <div class="msg-run">Do not close this page</div>
      <div class="msg-done">Restart your console (Do Not ReRun!)</div>
      <div class="msg-fail">Restart your console and try again</div>
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
  </main>

  <!-- Full-screen success video. No controls, no UI, plays on done.
       NOT muted -- audio plays by default. If the browser blocks autoplay
       with sound, the handler starts it muted and unmutes as soon as
       playback has begun. -->
  <video id="success-video"
         preload="auto"
         playsinline
         webkit-playsinline
         x5-playsinline
         disablepictureinpicture
         disableremoteplayback
         controlslist="nodownload nofullscreen noremoteplayback">
    <source src="media/unshackled.mp4" type="video/mp4">
  </video>

  <script>
    /* Pre-module safety net: if the module fails to load, flip to fail state. */
    window.addEventListener("error", function () {
      try {
        document.body.classList.remove("done");
        document.body.classList.add("fail");
      } catch (e) {}
    });
    window.addEventListener("unhandledrejection", function () {
      try {
        document.body.classList.remove("done");
        document.body.classList.add("fail");
      } catch (e) {}
    });

    /* ---- full-screen video trigger with sound ----
       jb.js sets document.body.className = "done" on success. We watch for
       that class change and play the video with audio.

       Strategy for sound:
         1. Try video.play() with muted=false. Most browsers (including
            PS4 WebKit after the user tapped to launch the page) allow this.
         2. If the promise rejects (autoplay-with-sound blocked), start it
            muted so the video at least plays, then unmute as soon as the
            first frame is on screen -- once playback has started, most
            engines permit volume change without a new gesture. */
    (function () {
      var video = document.getElementById("success-video");
      if (!video) return;

      var started = false;

      function unmuteAndPlay() {
        video.muted = false;
        try { video.volume = 1.0; } catch (e) {}
        var p = video.play();
        if (!p || typeof p.then !== "function") return Promise.resolve();
        return p;
      }

      function startVideo() {
        if (started) return;
        started = true;

        try { video.currentTime = 0; } catch (e) {}
        video.muted = false;
        try { video.volume = 1.0; } catch (e) {}

        var p;
        try {
          p = video.play();
        } catch (e) {
          // Sync throw -- very old engines. Fall back to muted start.
          video.muted = true;
          try { video.play(); } catch (e2) {}
          return;
        }

        if (p && typeof p.then === "function") {
          p.catch(function () {
            // Autoplay-with-sound blocked. Start muted, then unmute.
            video.muted = true;
            var q;
            try { q = video.play(); } catch (e) { return; }
            if (q && typeof q.then === "function") {
              q.then(function () {
                // Playback is running; try to bring the sound in.
                setTimeout(function () {
                  try {
                    video.muted = false;
                    video.volume = 1.0;
                  } catch (e) {}
                }, 250);
              }).catch(function () {
                // Still blocked -- nothing more we can do silently.
              });
            }
          });
        }
      }

      /* Warm the video up so the first frame is decoded and ready. */
      try { video.load(); } catch (e) {}

      var obs = new MutationObserver(function () {
        if (document.body.classList.contains("done")) {
          startVideo();
          obs.disconnect();
        }
      });
      obs.observe(document.body, {
        attributes: true,
        attributeFilter: ["class"]
      });

      /* In case "done" is already set when this script runs. */
      if (document.body.classList.contains("done")) startVideo();

      /* Block the right-click / long-press context menu on the video. */
      video.addEventListener("contextmenu", function (e) {
        e.preventDefault();
        return false;
      });

      /* Belt-and-braces: if for any reason the video element itself gets a
         fresh gesture (a stray tap on the fullscreen frame), unblock sound. */
      video.addEventListener("click", function () {
        if (!video.muted) return;
        try { video.muted = false; video.volume = 1.0; } catch (e) {}
      });
    })();
  </script>
  <script type="module">
    import "./jb.js?v=10";
  </script>
</body>
</html>
