<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Jailbreak</title>
<style>
  *{ box-sizing:border-box; }

  html{ height:100%; background:#08090c; }

  html::before{
    content:"";
    position:fixed;
    inset:0;
    background:url("background/bg.png") center / cover no-repeat;
    z-index:-2;
  }
  html::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,.06) 0%, rgba(0,0,0,.45) 100%);
    z-index:-1;
    pointer-events:none;
  }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
      calc(24px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
    color:#eef2f7;
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition: align-items .35s ease;
  }

  #card{
    position:relative;
    z-index:10;
    width:min(92vw, 440px);
    border-radius:20px;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.13);
    -webkit-backdrop-filter:blur(22px) saturate(170%);
            backdrop-filter:blur(22px) saturate(170%);
    box-shadow:
      0 24px 60px rgba(0,0,0,.42),
      0 2px 8px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.20);
    overflow:hidden;
    animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
    transition: width .35s ease;
  }
  #card::after{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(180deg,
      rgba(255,255,255,.08), rgba(255,255,255,0) 45%);
  }

  #brand{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-bottom:1px solid rgba(255,255,255,.10);
    background:rgba(0,0,0,.16);
    z-index:1;
  }
  #brand img{
    width:28px; height:28px;
    border-radius:50%;
    flex:0 0 auto;
  }
  #brand b{
    font-size:15px;
    font-weight:700;
    letter-spacing:.10em;
    color:#e6ebf2;
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
    min-width:0;
  }
  #brand .dot{
    width:9px; height:9px;
    border-radius:50%;
    background:#ffd894;
    box-shadow:0 0 12px #ffd894;
    animation: pulse 1.5s ease-in-out infinite;
    flex:0 0 auto;
  }
  .brand-run  { display:inline; }
  .brand-done { display:none;  color:#7ff0b8; }
  .brand-fail { display:none;  color:#ff9d9d; }
  body.done #brand .dot{ background:#7ff0b8; box-shadow:0 0 12px #7ff0b8; animation:none; }
  body.fail #brand .dot{ background:#ff9d9d; box-shadow:0 0 12px #ff9d9d; animation:none; }
  body.done .brand-run  { display:none; }
  body.done .brand-done { display:inline; }
  body.fail .brand-run  { display:none; }
  body.fail .brand-fail { display:inline; }

  #status{
    position:relative;
    width:64px;
    height:64px;
    margin:30px auto 22px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #spinner{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.10);
    border-top-color:#7ff0b8;
    border-right-color:rgba(127,240,184,.55);
    animation: spin .9s linear infinite;
    filter: drop-shadow(0 0 14px rgba(127,240,184,.35));
  }
  .status-svg{
    display:none;
    width:64px;
    height:64px;
    position:absolute;
    inset:0;
  }
  .status-check{ color:#7ff0b8; filter: drop-shadow(0 0 14px rgba(127,240,184,.55)); }
  .status-fail { color:#ff9d9d; filter: drop-shadow(0 0 14px rgba(255,120,120,.55)); }

  body.done #spinner{ display:none; }
  body.done .status-check{ display:block; }
  body.fail #spinner{ display:none; }
  body.fail .status-fail{ display:block; }

  #msg{
    display:none;
    text-align:center;
    padding:0 24px 26px;
    font-size:15px;
    line-height:1.4;
  }
  #msg .msg-run  { display:none;  color:rgba(238,242,247,.70); }
  #msg .msg-done { display:none;  color:#7ff0b8; text-shadow:0 0 24px rgba(127,240,184,.45); }
  #msg .msg-fail { display:none;  color:#ff9d9d; text-shadow:0 0 24px rgba(255,120,120,.45); }

  body.done #msg{ display:block; }
  body.done #msg .msg-done{ display:block; }
  body.fail #msg{ display:block; }
  body.fail #msg .msg-fail{ display:block; }

  #wrap{ display:none; position:relative; z-index:1; }

  body.log{ align-items:flex-start; }
  body.log #status,
  body.log #msg{ display:none !important; }
  body.log #card{
    width:min(94vw, 760px);
    display:flex;
    flex-direction:column;
    max-height: calc(100vh - 48px);
    margin:0 auto;
  }
  body.log #wrap{
    display:flex;
    flex-direction:column;
    flex:1;
    min-height:0;
    padding:16px 18px;
    gap:12px;
  }

  #state{
    display:none;
    font-size:17px;
    font-weight:650;
    letter-spacing:.01em;
    line-height:1.35;
    color:#eef2f7;
  }
  body.log #state{ display:block; }
  #state.ok  { color:#7ff0b8; }
  #state.warn{ color:#ffd894; }
  #state.bad { color:#ff9d9d; }
  #state::before{
    content:"";
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background:currentColor;
    margin-right:10px;
    vertical-align:middle;
    box-shadow:0 0 12px currentColor;
    animation: pulse 1.6s ease-in-out infinite;
  }

  #out{
    flex:1;
    min-height:0;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font:12px/1.55 ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
    padding:14px 16px;
    border-radius:12px;
    background:rgba(6,8,12,.42);
    border:1px solid rgba(255,255,255,.07);
    color:rgba(238,242,247,.88);
    scrollbar-width:thin;
    scrollbar-color: rgba(255,255,255,.22) transparent;
    overscroll-behavior:contain;
  }
  #out::-webkit-scrollbar{ width:9px; }
  #out::-webkit-scrollbar-track{ background:transparent; }
  #out::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.16);
    border-radius:6px;
    border:2px solid transparent;
    background-clip:content-box;
  }
  #out::-webkit-scrollbar-thumb:hover{
    background:rgba(255,255,255,.28);
    background-clip:content-box;
  }

  #out .ok,  #out .safe   { color:#7ff0b8; }
  #out .bad, #out .danger { color:#ff9d9d; }
  #out .warn              { color:#ffd894; }
  #out code               { color:#a8c4ff; }

  /* ---------- full-screen success video ----------
     Classic display: none -> block. No opacity, no z-index games,
     no transitions. The PS4 WebKit compositor handles this reliably. */
  #success-video{
    position:fixed;
    top:0; left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    background:#000;
    z-index:2147483647;
    display:none;
    pointer-events:none;
    -webkit-user-select:none;
    user-select:none;
  }
  body.done #success-video{
    display:block;
    pointer-events:auto;
  }
  /* Card gets taken out of the way entirely when the video plays.
     !important so the body.log card rules can't keep it visible. */
  body.done #card{ display:none !important; }

  /* "Tap for sound" pill: shown only when autoplay muted us and the
     browser wouldn't let us unmute without a fresh user gesture. */
  #sound-hint{
    position:fixed;
    bottom:calc(24px + env(safe-area-inset-bottom));
    left:50%;
    transform: translateX(-50%);
    padding:10px 18px;
    border-radius:999px;
    background:rgba(0,0,0,.68);
    color:#fff;
    font-size:13px;
    letter-spacing:.02em;
    z-index:2147483647;
    display:none;
    pointer-events:none;
    -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  body.video-muted #sound-hint{ display:block; animation: pulse 1.6s ease-in-out infinite; }

  @keyframes spin{ to { transform: rotate(360deg); } }
  @keyframes rise{
    from{ opacity:0; transform:translateY(12px) scale(.98); }
    to  { opacity:1; transform:none; }
  }
  @keyframes pulse{
    0%,100%{ opacity:.55; }
    50%    { opacity:1; }
  }

  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:innerblur(1px))){
    #card{ background:rgba(14,17,22,.78); }
  }
  @media (prefers-reduced-motion:reduce){
    #card, #spinner, #brand .dot, #state::before{ animation:none; }
    body.video-muted #sound-hint{ animation:none; }
  }
</style>
</head>
<body>
  <main id="card">
    <div id="brand">
      <img src="icon/jb.png" alt="" width="28" height="28">
      <b>
        <span class="dot"></span>
        <span class="brand-run">Jailbreaking…</span>
        <span class="brand-done">Jailbreak complete</span>
        <span class="brand-fail">Jailbreak failed</span>
      </b>
    </div>

    <div id="status">
      <div id="sp"></div>

      <svg class="status-svg status-check" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5"
                fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M9 16.6 L14 21.4 L23 11.6"
              fill="none" stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"/>
      </svg>

      <svg class="status-svg status-fail" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14.5"
                fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M11 11 L21 21 M21 11 L11 21"
              fill="none" stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"/>
      </svg>
    </div>

    <div id="msg">
      <div class="msg-run">Do not close this page</div>
      <div class="msg-done">Restart your console (Do Not ReRun!)</div>
      <div class="msg-fail">Restart your console and try again</div>
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
  </main>

  <!-- No muted attribute: we try unmuted first, fall back to muted. -->
  <video id="success-video"
         preload="auto"
         playsinline
         webkit-playsinline
         x5-playsinline
         disablepictureinpicture
         disableremoteplayback
         controlslist="nodownload nofullscreen noremoteplayback">
    <source src="media/unshackled.mp4" type="video/mp4">
  </video>

  <div id="sound-hint">Tap for sound</div>

  <script>
    /* Pre-module safety net. */
    window.addEventListener("error", function () {
      try {
        document.body.classList.remove("done", "video-muted");
        document.body.classList.add("fail");
      } catch (e) {}
    });
    window.addEventListener("unhandledrejection", function () {
      try {
        document.body.classList.remove("done", "video-muted");
        document.body.classList.add("fail");
      } catch (e) {}
    });

    /* ---- success detection + video playback ---------------------------------
       Triggers on EITHER:
         a) jb.js sets body.className = "done" (default, no ?log=1)
         b) the #out log text contains PROOF-SUMMARY-FINAL without INCOMPLETE
            and includes PAYLOAD-RUNNING (covers ?log=1, where jb.js never
            touches body.className)

       Video playback: unmuted first, muted fallback, then unmute on the
       first 'playing' event. If unmute is refused, we show a "Tap for sound"
       pill and unmute on the next tap anywhere on the page. */
    (function () {
      var video   = document.getElementById("success-video");
      var outEl   = document.getElementById("out");
      if (!video) return;

      var started   = false;
      var lastPlay  = 0;

      function hasClass(c){ try { return document.body.classList.contains(c); } catch (e) { return false; } }
      function addClass(c){ try { document.body.classList.add(c); } catch (e) {} }
      function removeClass(c){ try { document.body.classList.remove(c); } catch (e) {} }

      function showSoundHint()  { addClass("video-muted"); }
      function hideSoundHint()  { removeClass("video-muted"); }

      function tryUnmute() {
        try { video.muted = false; video.volume = 1.0; } catch (e) {}
        setTimeout(function () {
          if (video.muted) showSoundHint();
          else hideSoundHint();
        }, 300);
      }

      function tryPlay() {
        lastPlay = Date.now();

        // First attempt: unmuted.
        try { video.muted = false; video.volume = 1.0; } catch (e) {}

        var p;
        try { p = video.play(); }
        catch (e) {
          // Sync throw (very old engine) -- immediately fall back to muted.
          try {
            video.muted = true;
            video.play();
            showSoundHint();
          } catch (e2) {}
          return;
        }

        if (p && typeof p.then === "function") {
          p.then(function () {
            // Unmuted play succeeded -- clear any old hint.
            hideSoundHint();
          }).catch(function () {
            // Autoplay-with-sound rejected. Start muted and unmute on playing.
            try { video.muted = true; } catch (e) {}
            var q;
            try { q = video.play(); } catch (e) { showSoundHint(); return; }
            if (q && typeof q.then === "function") {
              q.then(function () {
                // Playback started muted; try to unmute.
                tryUnmute();
              }).catch(function () {
                showSoundHint();
              });
            } else {
              showSoundHint();
            }
          });
        }
      }

      video.addEventListener("playing", function () {
        if (video.muted) {
          // Give it a moment, then try unmuting.
          tryUnmute();
        } else {
          hideSoundHint();
        }
      });

      // Any tap anywhere unmutes an already-playing muted video.
      document.addEventListener("click", function () {
        if (!started) return;
        if (video.muted) {
          try { video.muted = false; video.volume = 1.0; } catch (e) {}
          if (!video.muted) hideSoundHint();
        }
      }, true);

      // Preload as early as possible so first frame is ready.
      try { video.preload = "auto"; video.load(); } catch (e) {}

      function start() {
        if (started) return;
        started = true;
        addClass("done");       // reveals the video via CSS
        try { video.currentTime = 0; } catch (e) {}
        tryPlay();
      }

      function evaluate() {
        if (started) return;

        // Trigger 1: body.done set by jb.js
        if (hasClass("done")) { start(); return; }

        // Trigger 2: log content (only relevant when body.log is set)
        if (outEl) {
          var txt = outEl.textContent || "";
          if (/PROOF-SUMMARY-FINAL/.test(txt) &&
              !/INCOMPLETE/.test(txt) &&
              /PAYLOAD-RUNNING/.test(txt)) {
            start();
            return;
          }
        }
      }

      // Watch body class changes (default jb.js path)
      try {
        new MutationObserver(evaluate).observe(document.body, {
          attributes: true, attributeFilter: ["class"]
        });
      } catch (e) {}

      // Watch #out changes (log-mode path)
      if (outEl) {
        try {
          new MutationObserver(evaluate).observe(outEl, {
            childList: true, subtree: true, characterData: true
          });
        } catch (e) {}
      }

      // Run once on load in case it's already settled.
      evaluate();

      // Watchdog: if we're in done but the video isn't playing, retry.
      setInterval(function () {
        evaluate();
        if (hasClass("done") && video.paused && Date.now() - lastPlay > 3000) {
          tryPlay();
        }
      }, 4000);

      video.addEventListener("contextmenu", function (e) {
        e.preventDefault();
        return false;
      });
    })();
  </script>
  <script type="module">
    import "./jb.js?v=10";
  </script>
</body>
</html>
