<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAW 13.52</title>
<style>
  *{ box-sizing:border-box; }
  html{ height:100%; background:#0b0d10; }
  html::before{
    content:"";
    position:fixed; inset:0;
    background:url("background/bg.png") center / cover no-repeat;
    z-index:-2;
  }
  html::after{
    content:"";
    position:fixed; inset:0;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,.05) 0%, rgba(0,0,0,.42) 100%);
    z-index:-1;
    pointer-events:none;
  }
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px 20px;
    color:#eef2f7;
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #card{
    position:relative;
    width:min(92vw,440px);
    border-radius:16px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
            backdrop-filter:blur(18px) saturate(160%);
    box-shadow:
      0 18px 50px rgba(0,0,0,.38),
      inset 0 1px 0 rgba(255,255,255,.18);
    overflow:hidden;
    animation:rise .45s cubic-bezier(.2,.7,.3,1) both;
  }
  #card::after{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(180deg,
      rgba(255,255,255,.08), rgba(255,255,255,0) 45%);
  }
  #brand{
    position:relative;
    text-align:center;
    padding:12px 14px;
    border-bottom:1px solid rgba(255,255,255,.10);
    background:rgba(0,0,0,.15);
  }
  #brand img{
    width:28px; height:28px; margin-right:8px;
    border-radius:50%; vertical-align:middle;
  }
  #brand b{
    font-size:15px; font-weight:700; letter-spacing:.14em;
    color:#e6ebf2; vertical-align:middle;
  }
  #wrap{ position:relative; padding:18px 20px; z-index:1; }
  #state{
    font-size:20px; font-weight:650; letter-spacing:.01em;
    margin:0 0 8px; color:#eef2f7;
    transition:color .25s ease, text-shadow .25s ease;
  }
  #state.ok  { color:#7ff0b8; text-shadow:0 0 20px rgba(110,231,168,.35); }
  #state.warn{ color:#ffd894; text-shadow:0 0 20px rgba(250,204,120,.30); }
  #state.bad { color:#ff9d9d; text-shadow:0 0 20px rgba(255,120,120,.30); }
  #det{ font-size:13px; color:rgba(238,242,247,.62); }
  #det b{ color:#fff; font-weight:600; }
  #cache{
    margin-top:14px; padding-top:12px; min-height:15px;
    font-size:12px; letter-spacing:.01em;
    color:rgba(238,242,247,.42);
    border-top:1px solid rgba(255,255,255,.09);
    transition:color .25s ease;
  }
  #cache.cacheok{ color:#7ff0b8; }
  #prompt{
    margin-top:14px; padding-top:12px; min-height:15px;
    font-size:13px; letter-spacing:.02em;
    color:#ffd894;
    border-top:1px solid rgba(255,255,255,.09);
    display:none;
  }
  #prompt.show{ display:block; animation: pulse 1.6s ease-in-out infinite; }

  /* ---- stats ---- */
  #stats{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.09);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .stat-block{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .stat-title{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:rgba(238,242,247,.45);
    font-weight:600;
  }
  .stat-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
  }
  .stat-pass{ color:#7ff0b8; font-weight:700; font-size:14px; }
  .stat-fail{ color:#ff9d9d; font-weight:700; font-size:14px; }
  .stat-stab{ color:#ffd894; font-weight:700; font-size:14px; margin-left:auto; }
  .stat-label{
    font-size:11px;
    color:rgba(238,242,247,.45);
    letter-spacing:.05em;
  }

  .ok   { color:#7ff0b8; }
  .bad  { color:#ff9d9d; }
  .warn { color:#ffd894; }

  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    #card{ background:rgba(16,20,26,.78); }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(10px) scale(.985); }
    to  { opacity:1; transform:none; }
  }
  @keyframes pulse{
    0%,100%{ opacity:.55; }
    50%    { opacity:1; }
  }
  @media (prefers-reduced-motion:reduce){
    #card{ animation:none; }
    #prompt.show{ animation:none; }
  }
</style>
</head>
<body>
<div id="card">
  <div id="brand">
    <img src="icon/jb.png" alt="" width="28" height="28"><b>RawBreaking 13.52</b>
  </div>
  <div id="wrap">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
    <div id="prompt"></div>
    <div id="stats">
      <div class="stat-block" id="stat-jb">
        <div class="stat-title">JB 13.52</div>
        <div class="stat-row">
          <span class="stat-label">Pass</span><b class="stat-pass">0</b>
          <span class="stat-label">Fail</span><b class="stat-fail">0</b>
          <span class="stat-stab">—</span>
        </div>
      </div>
      <div class="stat-block" id="stat-poops">
        <div class="stat-title">NetCTRL</div>
        <div class="stat-row">
          <span class="stat-label">Pass</span><b class="stat-pass">0</b>
          <span class="stat-label">Fail</span><b class="stat-fail">0</b>
          <span class="stat-stab">—</span>
        </div>
      </div>
      <div class="stat-block" id="stat-lapse">
        <div class="stat-title">lapse</div>
        <div class="stat-row">
          <span class="stat-label">Pass</span><b class="stat-pass">0</b>
          <span class="stat-label">Fail</span><b class="stat-fail">0</b>
          <span class="stat-stab">—</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
    var stateEl  = document.getElementById("state");
    var detEl    = document.getElementById("det");
    var cacheEl  = document.getElementById("cache");
    var promptEl = document.getElementById("prompt");

    function setState(t, c)  { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    function setPrompt(t)    {
        if (t) { promptEl.textContent = t; promptEl.classList.add("show"); }
        else   { promptEl.textContent = ""; promptEl.classList.remove("show"); }
    }

    // ---- read all three counters from localStorage ----
    function loadOne(key, blockId) {
        var success = 0, failed = 0;
        try {
            var raw = localStorage.getItem(key);
            if (raw) {
                var s = JSON.parse(raw);
                if (s && typeof s === "object") {
                    success = s.success | 0;
                    failed  = s.failed  | 0;
                }
            }
        } catch (e) {}
        var total = success + failed;
        var stability = total > 0 ? Math.round((success / total) * 100) : null;

        var block = document.getElementById(blockId);
        if (!block) return;
        var pass = block.querySelector(".stat-pass");
        var fail = block.querySelector(".stat-fail");
        var stab = block.querySelector(".stat-stab");
        if (pass) pass.textContent = String(success);
        if (fail) fail.textContent = String(failed);
        if (stab) stab.textContent = (stability === null) ? "—" : (stability + "%");
    }
    loadOne("ps4-jb-stats-v1",    "stat-jb");      // jb.html / 663 chain
    loadOne("ps4-poops-stats-v1", "stat-poops");   // chain_poops.html / NetCTRL
    loadOne("ps4-lapse-stats-v1", "stat-lapse");   // chain_lapse.html / lapse

    var params = new URLSearchParams(location.search);

    // Firmwares we route. 13.02+ goes to jb.html (663).
    // 12.50-13.00 goes to chain_poops.html (NetCTRL).
    // <= 12.02 goes to chain_lapse.html (lapse).
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = {
        1100: 1, 1150: 1, 1200: 1, 1202: 1,
        1250: 1, 1252: 1, 1300: 1,
        1302: 1, 1304: 1, 1350: 1, 1352: 1
    };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    function chainFor(fw) {
        if (fw === null) return { page: "chain_poops.html", label: "NetCTRL" };
        if (fw >= 1302)  return { page: "jb.html",           label: "JB 13.52" };
        if (fw <= 1202)  return { page: "chain_lapse.html",  label: "lapse" };
        return                  { page: "chain_poops.html",  label: "NetCTRL" };
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    var route = chainFor(fwnum);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported
            ? " &middot; <b>supported</b> &middot; chain <b>" + route.label + "</b>"
            : " &middot; not in this build's table");

    var target = route.page + location.search;

    // ---- one launch path. Nothing navigates without an explicit press. ----
    var launched = false;
    var armed = false;
    var ARM_DELAY_MS = 700;

    function waitForTap(msg, action) {
        setState(msg, "warn");
        setPrompt("Press X or tap the screen to start");

        armed = false;
        setTimeout(function () { armed = true; }, ARM_DELAY_MS);

        function fire(ev) {
            if (!armed) return;
            if (launched) return;
            launched = true;
            window.removeEventListener("click",     fire, true);
            window.removeEventListener("keydown",   fire, true);
            window.removeEventListener("touchend",  fire, true);
            window.removeEventListener("pointerup", fire, true);
            setPrompt("");
            action();
        }
        window.addEventListener("click",     fire, true);
        window.addEventListener("keydown",   fire, true);
        window.addEventListener("touchend",  fire, true);
        window.addEventListener("pointerup", fire, true);
    }

    function go() {
        setState("loading " + route.label + "...", "warn");
        setPrompt("");
        location.replace(target);
    }

    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ")", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        waitForTap("READY", go);
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        waitForTap("READY (offline)", go);
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        waitForTap("READY", go);
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY", function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
        }, false);

        waitForTap("READY", go);
    }
})();
</script>
</body>
</html>
