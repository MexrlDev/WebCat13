<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAW 13.52</title>
<style>
  *{ box-sizing:border-box; }
  html{ height:100%; background:#0b0d10; }
  html::before{
    content:"";
    position:fixed; inset:0;
    background:url("background/bg.png") center / cover no-repeat;
    z-index:-2;
  }
  html::after{
    content:"";
    position:fixed; inset:0;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,.05) 0%, rgba(0,0,0,.42) 100%);
    z-index:-1;
    pointer-events:none;
  }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 20px;
    color:#eef2f7;
    font:15px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #card{
    position:relative;
    width:min(92vw,440px);
    border-radius:16px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
            backdrop-filter:blur(18px) saturate(160%);
    box-shadow:
      0 18px 50px rgba(0,0,0,.38),
      inset 0 1px 0 rgba(255,255,255,.18);
    overflow:hidden;
    animation:rise .45s cubic-bezier(.2,.7,.3,1) both;
  }
  #card::after{
    content:"";
    position:absolute; inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(180deg,
      rgba(255,255,255,.08), rgba(255,255,255,0) 45%);
  }
  #brand{
    position:relative;
    text-align:center;
    padding:12px 14px;
    border-bottom:1px solid rgba(255,255,255,.10);
    background:rgba(0,0,0,.15);
  }
  #brand img{
    width:28px; height:28px; margin-right:8px;
    border-radius:50%; vertical-align:middle;
  }
  #brand b{
    font-size:15px; font-weight:700; letter-spacing:.14em;
    color:#e6ebf2; vertical-align:middle;
  }
  #wrap{
    position:relative;
    padding:18px 20px;
    z-index:1;
  }
  #state{
    font-size:20px;
    font-weight:650;
    letter-spacing:.01em;
    margin:0 0 8px;
    color:#eef2f7;
    transition:color .25s ease, text-shadow .25s ease;
  }
  #state.ok  { color:#7ff0b8; text-shadow:0 0 20px rgba(110,231,168,.35); }
  #state.warn{ color:#ffd894; text-shadow:0 0 20px rgba(250,204,120,.30); }
  #state.bad { color:#ff9d9d; text-shadow:0 0 20px rgba(255,120,120,.30); }
  #det{
    font-size:13px;
    color:rgba(238,242,247,.62);
  }
  #det b{ color:#fff; font-weight:600; }
  #cache{
    margin-top:14px;
    padding-top:12px;
    min-height:15px;
    font-size:12px;
    letter-spacing:.01em;
    color:rgba(238,242,247,.42);
    border-top:1px solid rgba(255,255,255,.09);
    transition:color .25s ease;
  }
  #cache.cacheok{ color:#7ff0b8; }
  #prompt{
    margin-top:14px;
    padding-top:12px;
    min-height:15px;
    font-size:13px;
    letter-spacing:.02em;
    color:#ffd894;
    border-top:1px solid rgba(255,255,255,.09);
    display:none;
  }
  #prompt.show{ display:block; animation: pulse 1.6s ease-in-out infinite; }
  #stats{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.09);
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:13px;
  }
  .stat-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .stat-label{
    color:rgba(238,242,247,.55);
    letter-spacing:.03em;
  }
  .stat-value{
    font-weight:700;
    font-size:15px;
    color:#fff;
    font-variant-numeric: tabular-nums;
  }
  .stat-value.ok  { color:#7ff0b8; }
  .stat-value.bad { color:#ff9d9d; }
  .stat-row.stability .stat-value{ color:#ffd894; }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    #card{ background:rgba(16,20,26,.78); }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(10px) scale(.985); }
    to  { opacity:1; transform:none; }
  }
  @keyframes pulse{
    0%,100%{ opacity:.55; }
    50%    { opacity:1; }
  }
  @media (prefers-reduced-motion:reduce){
    #card{ animation:none; }
    #prompt.show{ animation:none; }
  }
</style>
</head>
<body>
<div id="card">
  <div id="brand">
    <img src="icon/jb.png" alt="" width="28" height="28"><b>RawBreaking 13.52</b>
  </div>
  <div id="wrap">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
    <div id="prompt"></div>
    <div id="stats">
      <div class="stat-row">
        <span class="stat-label">Success</span>
        <b class="stat-value ok" id="stat-success">0</b>
      </div>
      <div class="stat-row">
        <span class="stat-label">Failed</span>
        <b class="stat-value bad" id="stat-failed">0</b>
      </div>
      <div class="stat-row stability">
        <span class="stat-label">Stability</span>
        <b class="stat-value" id="stat-stability">—</b>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
    var stateEl  = document.getElementById("state");
    var detEl    = document.getElementById("det");
    var cacheEl  = document.getElementById("cache");
    var promptEl = document.getElementById("prompt");

    function setState(t, c)  { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    function setPrompt(t)    {
        if (t) { promptEl.textContent = t; promptEl.classList.add("show"); }
        else   { promptEl.textContent = ""; promptEl.classList.remove("show"); }
    }

    (function loadStats() {
        var success = 0, failed = 0;
        try {
            var raw = localStorage.getItem("ps4-jb-stats-v1");
            if (raw) {
                var s = JSON.parse(raw);
                if (s && typeof s === "object") {
                    success = (typeof s.success === "number" && s.success >= 0) ? (s.success | 0) : 0;
                    failed  = (typeof s.failed  === "number" && s.failed  >= 0) ? (s.failed  | 0) : 0;
                }
            }
        } catch (e) {}
        var total = success + failed;
        var stability = total > 0 ? Math.round((success / total) * 100) : null;
        var sEl = document.getElementById("stat-success");
        var fEl = document.getElementById("stat-failed");
        var tEl = document.getElementById("stat-stability");
        if (sEl) sEl.textContent = String(success);
        if (fEl) fEl.textContent = String(failed);
        if (tEl) tEl.textContent = (stability === null) ? "—" : (stability + "%");
    })();

    var params = new URLSearchParams(location.search);
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;

    // ============================================================
    // Only the X button (Enter) or a touch/click activates.
    // No arming delay — the very first valid press fires immediately.
    // ============================================================
    function bindXorTap(action) {
        var fired = false;
        function tryFire(ev) {
            if (fired) return;
            if (!ev || ev.isTrusted !== true) return;

            if (ev.type === "keydown") {
                // PS4 reports the X button as the Enter key.
                var isEnter =
                    ev.key === "Enter" ||
                    ev.code === "Enter" ||
                    ev.code === "NumpadEnter" ||
                    ev.keyCode === 13;
                if (!isEnter) return;      // ignore Options, Circle, arrows, etc.
            }

            fired = true;
            window.removeEventListener("keydown",   tryFire, true);
            window.removeEventListener("click",     tryFire, true);
            window.removeEventListener("touchend",  tryFire, true);
            window.removeEventListener("pointerup", tryFire, true);
            action();
        }
        window.addEventListener("keydown",   tryFire, true);
        window.addEventListener("click",     tryFire, true);
        window.addEventListener("touchend",  tryFire, true);
        window.addEventListener("pointerup", tryFire, true);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        setPrompt("Press X or tap the screen to start");
        bindXorTap(function () {
            setPrompt("");
            action();
        });
    }

    function go() {
        setState("loading jailbreak...", "warn");
        setPrompt("");
        try { sessionStorage.setItem("jb-auth", "1"); } catch(e) {}
        location.replace(target);
    }

    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ")", go);
        return;
    }

    // ---- cache gate. Nothing navigates on its own. EVER. ----
    var ac = window.applicationCache;
    var cacheArmed = false;

    function armLaunch(msg) {
        if (cacheArmed) return;
        cacheArmed = true;
        waitForTap(msg || "READY", go);
    }

    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        armLaunch("READY");
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        armLaunch("READY (offline)");
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        armLaunch("READY");
    } else if (ac.status === ac.UPDATEREADY) {
        setCache("update ready -- press X to apply", true);
        setState("update ready", "warn");
        setPrompt("Press X or tap to apply update");
        bindXorTap(function () {
            try { ac.swapCache(); } catch (e) {}
            setTimeout(function () { location.reload(); }, 300);
        });
    } else {
        setCache("caching for offline (first run)...");
        setState("preparing offline cache...", "warn");
        setPrompt("Please wait — files are downloading");

        ac.addEventListener("downloading", function () {
            setCache("caching for offline (first run)...");
        }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                var pct = Math.round((e.loaded / e.total) * 100);
                setCache("caching " + pct + "%");
            }
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            setPrompt("");
            armLaunch("READY");
        }, false);
        ac.addEventListener("updateready", function () {
            setCache("update ready -- reload required", true);
            setState("update ready", "warn");
            setPrompt("Press X or tap to reload");
            bindXorTap(function () {
                try { ac.swapCache(); } catch (e) {}
                setTimeout(function () { location.reload(); }, 300);
            });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            setPrompt("");
            armLaunch("READY");
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache failed -- running from network");
            setPrompt("");
            armLaunch("READY (no cache)");
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete -- running now");
            setPrompt("");
            armLaunch("READY (obsolete)");
        }, false);

        setTimeout(function () {
            if (cacheArmed) return;
            setCache("cache timeout -- running from network");
            setPrompt("");
            armLaunch("READY (timeout)");
        }, 60000);
    }
})();
</script>
</body>
</html>
